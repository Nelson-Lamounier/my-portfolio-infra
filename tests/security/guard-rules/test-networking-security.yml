rules:
  - rule: "Networking Security Rule"
    description: "Ensure that all networking configurations are secure."
    condition: "Resources.Networking.*"
    compliance: "Must adhere to security best practices."
    checks:
      - check: "No open security groups"
        condition: "SecurityGroups[*].IpPermissions[*].IpRanges[*].CidrIp == '0.0.0.0/0'"
        result: "Fail"
      - check: "VPCs should have flow logs enabled"
        condition: "VPCs[*].EnableFlowLogs == true"
        result: "Fail"