rules:
  - rule: "Compute instances must not have public IP addresses"
    description: "Ensure that compute resources are not exposed to the public internet."
    resource: "AWS::EC2::Instance"
    condition: "PublicIp == false"

  - rule: "Compute instances must use approved AMIs"
    description: "Ensure that only approved Amazon Machine Images (AMIs) are used for compute instances."
    resource: "AWS::EC2::Instance"
    condition: "ImageId in ['ami-12345678', 'ami-87654321']"