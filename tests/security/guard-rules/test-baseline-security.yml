rules:
  - rule: "Ensure S3 buckets have versioning enabled"
    description: "S3 buckets should have versioning enabled to protect against accidental deletions."
    resource: "AWS::S3::Bucket"
    condition: "VersioningConfiguration.Status == 'Enabled'"

  - rule: "Ensure IAM policies do not allow '*' actions"
    description: "IAM policies should not allow '*' actions to enforce least privilege."
    resource: "AWS::IAM::Policy"
    condition: "Action != '*'"

  - rule: "Ensure security groups do not allow unrestricted ingress"
    description: "Security groups should not allow unrestricted ingress to protect resources."
    resource: "AWS::EC2::SecurityGroup"
    condition: "IpPermissions[].IpRanges[].CidrIp != '0.0.0.0/0'"