rules:
  - rule: "IAM roles must not have wildcard permissions"
    description: "Ensure that IAM roles do not have '*' as an action."
    resource: "AWS::IAM::Role"
    condition: "not contains(actions, '*')"

  - rule: "IAM policies must not allow full access"
    description: "Ensure that IAM policies do not allow full access to resources."
    resource: "AWS::IAM::Policy"
    condition: "not contains(actions, 'All')"

  - rule: "IAM roles must have a trust policy"
    description: "Ensure that IAM roles have a defined trust policy."
    resource: "AWS::IAM::Role"
    condition: "exists(trustPolicy)"