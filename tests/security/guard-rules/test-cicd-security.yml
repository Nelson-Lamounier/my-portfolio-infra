rules:
  - rule: "CI/CD Pipeline Security"
    description: "Ensure that CI/CD pipelines do not expose sensitive information."
    condition: "pipeline.environment != 'production'"
    message: "Do not use production credentials in non-production environments."
  
  - rule: "Artifact Storage Security"
    description: "Validate that artifacts are stored securely."
    condition: "artifact.storage != 'secure'"
    message: "Artifacts must be stored in a secure location."

  - rule: "Access Control"
    description: "Ensure that access to CI/CD tools is restricted."
    condition: "access.control != 'restricted'"
    message: "Access to CI/CD tools must be restricted to authorized personnel."