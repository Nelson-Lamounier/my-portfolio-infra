# tests/fixtures/templates/ec2-template.yml
AWSTemplateFormatVersion: '2010-09-09'
Description: 'Test EC2 template with security groups'

Parameters:
  VpcId:
    Type: String
    Default: vpc-12345678
    Description: VPC ID for resources

  SubnetId:
    Type: String
    Default: subnet-12345678
    Description: Subnet ID for EC2 instance

Resources:
  # Security Group (intentionally insecure for testing)
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web server security group with intentional vulnerabilities
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # SSH access from anywhere (should trigger security rules)
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access
        # RDP access from anywhere (should trigger security rules)
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: 0.0.0.0/0
          Description: RDP access
        # HTTP access
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP access
        # HTTPS access
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS access
      Tags:
        - Key: Name
          Value: web-security-group

  # EC2 Instance
  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0c55b159cbfafe1d0  # Amazon Linux 2 (us-east-1)
      InstanceType: t3.micro
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      # No encryption on EBS volumes (should trigger security rules)
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            DeleteOnTermination: true
            # Encrypted: false  # Intentionally not encrypted
      Tags:
        - Key: Name
          Value: web-server
        - Key: Environment
          Value: test

  # IAM Role with overly broad permissions (should trigger IAM rules)
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess  # Overly broad permissions
      Tags:
        - Key: Name
          Value: ec2-role

  # Instance Profile
  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref WebServer
  
  SecurityGroupId:
    Description: Security Group ID
    Value: !Ref WebSecurityGroup