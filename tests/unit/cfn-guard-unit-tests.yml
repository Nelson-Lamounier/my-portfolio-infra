rules:
  - rule: "Ensure that all IAM roles have a trusted entity defined"
    description: "This rule checks that IAM roles specify a trusted entity."
    compliance: "Fail"
    test: 
      - "IAMRole"
      - "has_trusted_entity"

  - rule: "Ensure that security groups do not allow unrestricted access"
    description: "This rule checks that security groups do not allow 0.0.0.0/0 access."
    compliance: "Fail"
    test: 
      - "SecurityGroup"
      - "not_allow_unrestricted_access"

  - rule: "Ensure that all EC2 instances have a defined key pair"
    description: "This rule checks that EC2 instances specify a key pair."
    compliance: "Fail"
    test: 
      - "EC2Instance"
      - "has_key_pair"