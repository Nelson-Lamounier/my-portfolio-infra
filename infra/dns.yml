# @format
---
AWSTemplateFormatVersion: "2010-09-09"
Description: |
  Route 53 DNS Configuration for Portfolio Infrastructure

  This template creates DNS alias records that map custom domain names to the
  Application Load Balancer (ALB). All domains point to the same ALB, which
  uses host-based routing to direct traffic to appropriate ECS services.

  DNS Architecture:
  - Root domain: Main portfolio site
  - WWW subdomain: Redirects or serves same content as root
  - Project subdomains: Individual project applications
  - API subdomain: Backend services for full-stack applications

  All records use Route 53 alias records for:
  - Better performance (direct AWS routing)
  - No additional charges for DNS queries
  - Automatic IP address updates if ALB changes

Parameters:
  RootDomainName:
    Type: String
    Description: |
      Root domain name for the main portfolio site.
      This is the apex domain without any subdomain prefix.
      Example: 'lamounierdigital.com', 'myportfolio.com'
      Used for the primary portfolio landing page.

  WWWDomainName:
    Type: String
    Description: |
      WWW subdomain for the portfolio site.
      Traditional www prefix for the main site, often used for:
      - SEO purposes and user familiarity
      - Redirecting to root domain or serving identical content
      Example: 'www.lamounierdigital.com', 'www.myportfolio.com'

  Project1Domain:
    Type: String
    Description: |
      Subdomain for the first project application.
      This subdomain hosts a specific project or application demo.
      Example: 'project1.lamounierdigital.com', 'demo1.myportfolio.com'
      ALB routing rules direct this traffic to Project1 ECS service.

  Project2Domain:
    Type: String
    Description: |
      Subdomain for the second project application.
      Similar to Project1 but for a different application or demo.
      Example: 'project2.lamounierdigital.com', 'app2.myportfolio.com'
      ALB routing rules direct this traffic to Project2 ECS service.

  ProjectFrontendEcommDomain:
    Type: String
    Description: |
      Subdomain for the e-commerce frontend application.
      Hosts the customer-facing shopping interface for full-stack demo.
      Example: 'shop.lamounierdigital.com', 'store.myportfolio.com'
      ALB routing rules direct this traffic to Frontend ECS service.

  ProjectBackendEcommDomain:
    Type: String
    Description: |
      Subdomain for the e-commerce backend API.
      Hosts the REST API endpoints for the e-commerce application.
      Example: 'api.lamounierdigital.com', 'backend.myportfolio.com'
      ALB routing rules direct this traffic to Backend ECS service.

  HostedZoneId:
    Type: String
    Description: |
      Route 53 Hosted Zone ID for the domain.
      This hosted zone must already exist and be configured for your domain.
      Find this ID in the Route 53 console under your domain's hosted zone.
      Format: Alphanumeric string (e.g., 'Z1D633PJN98FT9')

Resources:
  # DNS Record: WWW subdomain alias to Application Load Balancer
  Route53AliasRecordWWW:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId # Target hosted zone for DNS record
      Name: !Ref WWWDomainName # WWW subdomain (e.g., www.lamounierdigital.com)
      Type: A # IPv4 address record type
      AliasTarget:
        # ALB DNS name - imported from load balancer stack
        DNSName: !ImportValue LoadBalancerDNS
        # ALB hosted zone ID - required for alias records
        HostedZoneId: !ImportValue LoadBalancerHostedZoneId

  # DNS Record: Root domain alias to Application Load Balancer
  Route53AliasRecordRoot:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId # Target hosted zone for DNS record
      Name: !Ref RootDomainName # Root domain (e.g., lamounierdigital.com)
      Type: A # IPv4 address record type
      AliasTarget:
        # ALB DNS name - shared across all subdomains for host-based routing
        DNSName: !ImportValue LoadBalancerDNS
        # ALB hosted zone ID - enables Route 53 to route directly to ALB
        HostedZoneId: !ImportValue LoadBalancerHostedZoneId

  # DNS Record: Project 1 subdomain alias to Application Load Balancer
  Project1DNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId # Target hosted zone for DNS record
      Name: !Ref Project1Domain # Project 1 subdomain (e.g., project1.lamounierdigital.com)
      Type: A # IPv4 address record type
      AliasTarget:
        # Same ALB serves all domains - routing differentiated by host headers
        DNSName: !ImportValue LoadBalancerDNS
        # ALB hosted zone enables automatic IP resolution
        HostedZoneId: !ImportValue LoadBalancerHostedZoneId

  # DNS Record: Project 2 subdomain alias to Application Load Balancer
  Project2DNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId # Target hosted zone for DNS record
      Name: !Ref Project2Domain # Project 2 subdomain (e.g., project2.lamounierdigital.com)
      Type: A # IPv4 address record type
      AliasTarget:
        # Centralized ALB handles all domain routing through listener rules
        DNSName: !ImportValue LoadBalancerDNS
        # ALB zone ID required for alias target configuration
        HostedZoneId: !ImportValue LoadBalancerHostedZoneId

  # DNS Record: E-commerce Frontend subdomain alias to Application Load Balancer
  ProjectFrontendEcommDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId # Target hosted zone for DNS record
      Name: !Ref ProjectFrontendEcommDomain # Frontend subdomain (e.g., shop.lamounierdigital.com)
      Type: A # IPv4 address record type
      AliasTarget:
        # ALB uses host-based routing to direct traffic to appropriate service
        DNSName: !ImportValue LoadBalancerDNS
        # Route 53 alias eliminates need for IP address management
        HostedZoneId: !ImportValue LoadBalancerHostedZoneId

  # DNS Record: E-commerce Backend API subdomain alias to Application Load Balancer
  ProjectBackendEcommDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId # Target hosted zone for DNS record
      Name: !Ref ProjectBackendEcommDomain # Backend subdomain (e.g., api.lamounierdigital.com)
      Type: A # IPv4 address record type
      AliasTarget:
        # Same ALB endpoint - listener rules differentiate API vs frontend traffic
        DNSName: !ImportValue LoadBalancerDNS
        # ALB hosted zone ID enables direct AWS internal routing
        HostedZoneId: !ImportValue LoadBalancerHostedZoneId
# Template Architecture and Usage Notes:
#
# 1. DNS Strategy:
#    - Single ALB serves multiple domains through host-based routing
#    - Route 53 alias records provide automatic IP resolution
#    - No additional DNS query charges for alias records
#    - Automatic failover if ALB IP addresses change
#
# 2. Load Balancer Integration:
#    - All DNS records point to the same Application Load Balancer
#    - ALB listener rules examine Host headers to route traffic
#    - Each domain can serve different applications/services
#    - SSL/TLS termination handled at ALB level
#
# 3. Prerequisites:
#    - Route 53 hosted zone must exist for the domain
#    - Domain must be registered and NS records configured
#    - ALB must be deployed and outputs exported
#    - SSL certificate should be configured on ALB for HTTPS
#
# 4. Security Considerations:
#    - DNS records are publicly resolvable
#    - ALB security groups control actual access
#    - Consider WAF integration for additional protection
#    - Monitor DNS query patterns for unusual activity
#
# 5. Performance Benefits:
#    - Alias records resolve directly to ALB IPs
#    - No additional DNS lookup overhead
#    - Automatic health checking at ALB level
#    - CloudFront can be added later for global caching
#
# 6. Operational Considerations:
#    - DNS propagation may take up to 48 hours globally
#    - Use Route 53 health checks for monitoring
#    - Consider weighted or latency-based routing for multi-region
#    - Backup DNS records can be created for disaster recovery
#
# 7. Cost Optimization:
#    - Alias records incur no additional Route 53 charges
#    - Single ALB serves multiple domains efficiently
#    - Consider Reserved Capacity for predictable ALB usage
#    - Monitor ALB request patterns for potential optimizations
