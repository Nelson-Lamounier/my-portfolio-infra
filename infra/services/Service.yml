# @format
---
AWSTemplateFormatVersion: "2010-09-09"
Description: |
  ECS Service and Task Definition for Portfolio Application

  This template creates the core compute resources for running the portfolio
  application as containers in Amazon ECS. It includes:

  - Task Definition: Blueprint specifying container configuration
  - ECS Service: Manages desired number of running tasks
  - CloudWatch Logs: Centralized logging for monitoring and debugging
  - Load Balancer Integration: Connects containers to ALB for traffic distribution

  The service uses EC2 launch type with bridge networking for cost efficiency
  while maintaining the ability to run multiple containers per instance.

Parameters:
  Region:
    Type: String
    Description: |
      AWS region where resources will be deployed.
      Used for CloudWatch logs configuration and ECR image registry references.
      Must match the region where ECS cluster and other resources are deployed.

  ECSClusterNameParam:
    Type: String
    Description: |
      Name of the target ECS cluster for service deployment.
      This cluster must exist and have registered EC2 instances available.
      The service will schedule tasks on instances within this cluster.

  ECSServiceNameParam:
    Type: String
    Description: |
      Unique name for the ECS service.
      Used to identify this service within the ECS cluster.
      Should follow naming conventions and be descriptive of the application.
      Example: 'portfolio-service', 'main-app-service'

Resources:
  # CloudWatch Log Group: Centralized logging for container output
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/portfolio-task # Standard ECS log group naming pattern
      RetentionInDays: 1 # Short retention for development - increase for production
      # Tags can be added here for cost allocation and organization

  # Task Definition: Container blueprint and resource allocation
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: portfolio-task # Task definition family name for versioning
      Cpu: 256 # Total CPU units (1 vCPU = 1024 units)
      Memory: 512 # Total memory in MB for all containers
      RequiresCompatibilities:
        - EC2 # Use EC2 launch type (vs Fargate)
      NetworkMode: bridge # Changed from awsvpc to bridge for EC2 efficiency
      ExecutionRoleArn: !ImportValue TaskExecutionRoleArn # IAM role for ECS agent operations

      ContainerDefinitions:
        # Primary application container configuration
        - Name: app-container # Container identifier within task
          # ECR image URL with latest tag - updated by CI/CD pipeline
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/portfolio-dev:latest"
          Cpu: 256 # CPU units allocated to this container
          MemoryReservation: 512 # Soft memory limit - container can use more if available
          Essential: true # Task fails if this container stops

          PortMappings:
            - ContainerPort: 80 # Port the application listens on inside container
              HostPort: 8080 # Explicit host port mapping for ALB target group
              Protocol: tcp # TCP protocol for HTTP traffic

          # Logging configuration for CloudWatch integration
          LogConfiguration:
            LogDriver: awslogs # Use AWS CloudWatch Logs driver
            Options:
              awslogs-group: /ecs/portfolio-task # Target log group
              awslogs-region: !Ref Region # Region for log delivery
              awslogs-stream-prefix: ecs # Log stream naming prefix

  # ECS Service: Manages running tasks and integrates with load balancer
  ECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Ref ECSServiceNameParam # Service identifier within cluster
      Cluster: !ImportValue ECSClusterName # Target ECS cluster from networking stack
      DesiredCount: 1 # Number of tasks to maintain running
      LaunchType: EC2 # Use EC2 instances (vs Fargate)
      TaskDefinition: !Ref TaskDefinition # Reference to task definition above

      # Load Balancer Integration: Connect service to Application Load Balancer
      LoadBalancers:
        - ContainerName: app-container # Must match container name in task definition
          ContainerPort: 80 # Container port for health checks and traffic
          TargetGroupArn: !ImportValue TargetGroupArn # ALB target group from load balancer stack

      # Service Management Configuration
      EnableECSManagedTags: true # Enable ECS-managed tags for cost tracking
      DeploymentController:
        Type: ECS # Use ECS rolling deployment (vs CODE_DEPLOY)
      HealthCheckGracePeriodSeconds: 180 # Time to wait before health checks start

      # Deployment Strategy: Optimized for single-instance development
      DeploymentConfiguration:
        MaximumPercent: 100 # Allow up to 100% during deployment
        MinimumHealthyPercent: 0 # Allow all tasks to be replaced (for single instance)

      # Placement strategy can be added for multi-instance clusters
      # PlacementStrategy:
      #   - Type: spread
      #     Field: instanceId

      # Service tags for organization and cost allocation
      Tags:
        - Key: Application
          Value: Portfolio
        - Key: Component
          Value: WebService
        - Key: Environment
          Value: Development

Outputs:
  ECSServiceName:
    Description: |
      Name of the created ECS service.

      This output provides the service name for reference by other stacks
      or for monitoring and management purposes. The service name is used
      by CI/CD pipelines for deployment updates and by monitoring tools.
    Value: !Ref ECSService
    Export:
      Name: ECSServiceName # Global export for cross-stack references

  ECSServiceArn:
    Description: |
      ARN of the created ECS service.

      Full ARN for the service, useful for IAM policies, monitoring,
      and integration with other AWS services that require ARN references.
    Value: !Ref ECSService
    Export:
      Name: ECSServiceArn

  TaskDefinitionArn:
    Description: |
      ARN of the task definition.

      Can be used to reference this specific task definition version
      for debugging, rollbacks, or creating additional services.
    Value: !Ref TaskDefinition
    Export:
      Name: PortfolioTaskDefinitionArn
# Template Architecture and Operational Notes:
#
# 1. Resource Allocation:
#    - 256 CPU units (0.25 vCPU) suitable for lightweight web applications
#    - 512 MB memory adequate for Node.js/React applications
#    - Consider increasing for resource-intensive applications
#
# 2. Networking Configuration:
#    - Bridge mode allows multiple containers per EC2 instance
#    - Explicit host port mapping (8080) for predictable ALB routing
#    - Consider awsvpc mode for enhanced security isolation
#
# 3. Deployment Strategy:
#    - Rolling deployment with ECS controller
#    - Zero-downtime deployments not guaranteed with current settings
#    - Adjust MinimumHealthyPercent for high availability requirements
#
# 4. Monitoring and Logging:
#    - CloudWatch Logs integration for centralized logging
#    - 1-day retention for development - increase for production
#    - Consider structured logging for better searchability
#
# 5. Security Considerations:
#    - Task execution role provides minimal required permissions
#    - Container runs with default user - consider non-root user
#    - Environment variables in plain text - use Systems Manager for secrets
#
# 6. Scaling Considerations:
#    - Manual scaling via DesiredCount parameter
#    - Auto Scaling can be added with target tracking policies
#    - Consider Application Auto Scaling for dynamic scaling
#
# 7. Health Check Configuration:
#    - 180-second grace period for application startup
#    - Health checks performed by ALB target group
#    - Consider custom health check endpoints for better monitoring
#
# 8. Cost Optimization:
#    - EC2 launch type more cost-effective than Fargate for persistent workloads
#    - Right-size CPU and memory based on actual usage patterns
#    - Use Reserved Instances for predictable workloads
