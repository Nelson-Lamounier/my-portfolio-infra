# @format
---
AWSTemplateFormatVersion: "2010-09-09"
Description: |
  Full-Stack E-commerce Service Template

  This template creates a multi-container ECS service for the full-stack
  e-commerce demo application with both frontend and backend containers.

Parameters:
  ProjectName:
    Type: String
    Description: |
      Unique identifier for the project (e.g., 'Portfolio', 'Project1', 'Project2').
      Used to create unique resource names and avoid conflicts between services.
      Should match the naming convention used throughout your infrastructure.

  ServiceName:
    Type: String
    Description: |
      Name for the ECS service within the cluster.
      Will be used as the service identifier and for monitoring purposes.
      Example: 'portfolio-service', 'project1-service'

  ContainerName:
    Type: String
    Description: |
      Name of the primary container within the task definition.
      Must match the container name expected by CI/CD pipelines for deployments.
      Example: 'app-container', 'project1-container'

  ECRRepository:
    Type: String
    Description: |
      Name of the ECR repository containing the container image.
      Repository must exist and contain a valid image tagged as 'latest'.
      Example: 'portfolio-dev', 'project1-repo'

  ContainerPort:
    Type: Number
    Description: |
      Port that the application listens on inside the container.
      This is the port exposed by your application (e.g., Express.js on 3000).

  HostPort:
    Type: Number
    Description: |
      HostPort that the application listens on inside the container.
      This is the port exposed by your application (e.g., Express.js on 3000).

  CPU:
    Type: Number
    Description: |
      CPU units allocated to the task (1024 units = 1 vCPU).
      Adjust based on application requirements and expected load.
    Default: 256

  Memory:
    Type: Number
    Description: |
      Memory in MB allocated to the task.
      Should be sized based on application memory usage patterns.
    Default: 512

  DesiredCount:
    Type: Number
    Description: |
      Number of tasks to maintain running for this service.
      Start with 1 for development, increase for production availability.
    Default: 1

  TargetGroupArn:
    Type: String
    Description: |
      ARN of the ALB target group for this service.
      Each service should have its own target group for proper routing.
      Target group must be configured with appropriate health check settings.

  Region:
    Type: String
    Description: |
      AWS region for resource deployment.
      Used for ECR repository URLs and CloudWatch log configuration.

  MigrationMode:
    Type: String
    Description: Migration mode to handle existing log groups
    Default: "migrate"
    AllowedValues: ["migrate", "no-migrate"]

  ExportSuffix:
    Type: String
    Description: Optional suffix for export names to avoid conflicts during migration
    Default: ""

Conditions:
  CreateNewLogGroup: !Equals [!Ref MigrationMode, "no-migrate"]
  IsMigrationMode: !Equals [!Ref MigrationMode, "migrate"]
  HasExportSuffix: !Not [!Equals [!Ref ExportSuffix, ""]]
  IsNextJS: !Equals [!Ref ProjectName, "Project1"] # Project1 uses Next.js
  IsReact: !Equals [!Ref ProjectName, "Portfolio"] # Portfolio uses React
  IsStatic: !Equals [!Ref ProjectName, "Project2"]
  Region:
    Type: String
    Description: AWS region for deployment

Resources:
  # Frontend Log Group
  ProjectFrontendEcommLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateNewLogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: /ecs/frontend-ecomm-task
      RetentionInDays: 7

  # Backend Log Group
  ProjectBackendEcommLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateNewLogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: /ecs/backend-ecomm-task
      RetentionInDays: 7

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: fullstack-ecommerce-task
      Cpu: 512
      Memory: 1024
      RequiresCompatibilities:
        - EC2
      NetworkMode: bridge
      ExecutionRoleArn: !ImportValue TaskExecutionRoleArn
      ContainerDefinitions:
        - Name: project-frontend-ecomm-container
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${Region}.amazonaws.com/frontend-ecomm-dev:latest"
          Cpu: 256
          MemoryReservation: 512
          Essential: true
          PortMappings:
            - ContainerPort: 3002
              HostPort: 3002
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/frontend-ecomm-task
              awslogs-region: !Ref Region
              awslogs-stream-prefix: ecs
              awslogs-create-group: "true"

        - Name: project-backend-ecomm-container
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${Region}.amazonaws.com/backend-ecomm-dev:latest"
          Cpu: 256
          MemoryReservation: 512
          Essential: true # Changed to true for better reliability
          PortMappings:
            - ContainerPort: 4000
              HostPort: 4000
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/backend-ecomm-task
              awslogs-region: !Ref Region
              awslogs-stream-prefix: ecs
              awslogs-create-group: "true"

  ProjectFullStackECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: fullstack-ecomm-service
      Cluster: !ImportValue ECSClusterName
      DesiredCount: 1
      LaunchType: EC2
      TaskDefinition: !Ref TaskDefinition
      LoadBalancers:
        - ContainerName: project-frontend-ecomm-container
          ContainerPort: 3002
          TargetGroupArn: !ImportValue ProjectFrontendEcommTargetGroupArn
        - ContainerName: project-backend-ecomm-container
          ContainerPort: 4000
          TargetGroupArn: !ImportValue ProjectBackendEcommTargetGroupArn
      EnableECSManagedTags: true
      DeploymentController:
        Type: ECS
      HealthCheckGracePeriodSeconds: 180
      DeploymentConfiguration:
        MaximumPercent: 200 # Allow extra capacity during deployment
        MinimumHealthyPercent: 50 # Maintain some capacity
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      Tags:
        - Key: Project
          Value: ProjectFullStack
        - Key: ServiceType
          Value: WebApplication
        - Key: Component
          Value: ECSService

Outputs:
  ProjectFullStackECSServiceName:
    Description: Name of the full-stack ECS service
    Value: fullstack-ecomm-service # Return service name, not ARN
    Export:
      Name: ProjectFullStackECSServiceName

  ProjectFullStackECSServiceArn:
    Description: ARN of the full-stack ECS service
    Value: !Ref ProjectFullStackECSService
    Export:
      Name: ProjectFullStackECSServiceArn
