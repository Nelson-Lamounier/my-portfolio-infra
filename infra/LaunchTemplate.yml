# @format
---
AWSTemplateFormatVersion: "2010-09-09"
Description: |
  Launch Template for ECS EC2 Instances

  This template creates a launch template that defines the configuration for EC2 instances
  that will join an ECS cluster to run containerized applications. The template includes:

  - IAM roles and instance profiles for ECS operations
  - Security groups with appropriate port access for web applications
  - User data script for automatic ECS cluster registration
  - Optimized instance configuration for container workloads

  The instances created from this template will automatically register with the specified
  ECS cluster and be available to run tasks and services.

Parameters:
  ECSAMI:
    Description: |
      Amazon Machine Image ID for ECS-optimized instances.
      This parameter automatically retrieves the latest ECS-optimized AMI ID from AWS Systems Manager.
      The AMI includes Docker, ECS agent, and other necessary components pre-installed and configured.
      Using the SSM parameter ensures you always get the latest stable version without manual updates.
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id

  ECSClusterNameParam:
    Type: String
    Description: |
      Name of the target ECS cluster for instance registration.
      This name must match exactly with the ECS cluster created in your infrastructure.
      Instances will automatically register with this cluster during bootstrap process.
      Example: 'portfolio-cluster', 'production-cluster'

  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: |
      Public subnet ID where EC2 instances will be launched.
      Should be a public subnet with internet gateway access for:
      - Downloading packages and updates
      - Pulling container images from ECR/DockerHub
      - Outbound internet connectivity for applications
      Must be in the same VPC as the ECS cluster.

  CidrIp:
    Type: String
    Default: |
      Use to secure SSH access to the instances from a specific IP or range.

Resources:
  # IAM Role: Grants EC2 instances necessary permissions to operate as ECS container hosts
  ECSInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      # Trust policy: Allow EC2 service to assume this role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com # EC2 service can assume this role
            Action: sts:AssumeRole

      # AWS managed policies providing essential ECS and monitoring capabilities
      ManagedPolicyArns:
        # Core ECS permissions: Register with cluster, start/stop tasks, report status
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        # CloudWatch monitoring: Send metrics and logs for observability
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        # Systems Manager: Enable remote management and patch management
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  # Instance Profile: Wrapper that allows EC2 instances to use the IAM role
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        # Associate the ECS instance role with this profile
        - !Ref ECSInstanceRole

  # Security Group: Network access control for ECS instances
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ECS EC2 instance with application and SSH access
      VpcId: !ImportValue VPC # Reference VPC created by networking stack

      SecurityGroupIngress:
        # HTTP traffic: Standard web traffic for load balancer health checks
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !ImportValue LoadBalancerSGId
          Description: "HTTP access for load balancer and web traffic"

        # Alternative HTTP port: Common for development and custom applications
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !ImportValue LoadBalancerSGId
          Description: "Alternative HTTP port for applications"

        # SSH access: Remote administration and troubleshooting
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref CidrIp
          Description: "SSH access for remote administration"

        # Development ports: Common application development port range
        - IpProtocol: tcp
          FromPort: 32768
          ToPort: 65535
          SourceSecurityGroupId: !ImportValue LoadBalancerSGId
          Description: "Development application ports (React, Node.js, etc.)"

        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !ImportValue LoadBalancerSGId
          Description: "Development application ports (React, Node.js, etc.)"

        - IpProtocol: tcp
          FromPort: 3001
          ToPort: 3001
          SourceSecurityGroupId: !ImportValue LoadBalancerSGId
          Description:
            "Development application ports (React, Node.js, etc.)"

            # ECS agent communication
        - IpProtocol: tcp
          FromPort: 51678
          ToPort: 51678
          SourceSecurityGroupId: !ImportValue LoadBalancerSGId

        # API/Backend port: Common port for backend services
        # - IpProtocol: tcp
        #   FromPort: 4000
        #   ToPort: 4000
        #   CidrIp: 0.0.0.0/0
        #   Description: "Backend/API service port"

      SecurityGroupEgress:
        # HTTPS for ECS API calls and ECR
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: "HTTPS for ECS API and ECR"

        # HTTP for package updates
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: "HTTP for updates"

        # DNS resolution
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
          Description: "DNS resolution"

        # NTP for time synchronization
        - IpProtocol: udp
          FromPort: 123
          ToPort: 123
          CidrIp: 0.0.0.0/0
          Description: "NTP time sync"

  # Launch Template: Defines the blueprint for EC2 instance configuration
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: PortfolioEC2Template # Unique identifier for this template
      LaunchTemplateData:
        # Instance type: Balanced performance for container workloads
        InstanceType: t3.large # 2 vCPU, 8 GB RAM - suitable for multiple containers

        # Instance metadata security: Enhanced security for instance metadata service
        MetadataOptions:
          HttpTokens: required # Require authentication tokens (IMDSv2)
          HttpEndpoint: enabled # Enable metadata service

        # AMI reference: Use the ECS-optimized AMI parameter
        ImageId: !Ref ECSAMI

        # SSH key pair: For remote access and troubleshooting
        # Note: Ensure this key pair exists in your AWS account
        KeyName: freelancer-key-pair

        # IAM instance profile: Grants necessary permissions to the instance
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn

        # Security groups: Apply network access rules
        SecurityGroupIds:
          - !Ref EC2SecurityGroup

        # User data script: Initialization commands run on first boot
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # Bootstrap script for ECS instance initialization

            # Configure ECS agent: Register instance with the specified cluster
            echo ECS_CLUSTER=${ECSClusterNameParam} >> /etc/ecs/ecs.config

            # Enable IAM roles for tasks: Allow containers to assume IAM roles
            echo ECS_ENABLE_TASK_IAM_ROLE=true >> /etc/ecs/ecs.config

            # Docker data directory: Use separate volume for container storage
            mkdir -p /data/docker
            echo "OPTIONS=\"--data-root=/data/docker\"" >> /etc/docker/daemon.json

            # Install CloudFormation helper scripts for advanced instance management
            yum install -y aws-cfn-bootstrap

            # Initialize CloudFormation configuration (if additional config needed)
            # Note: ContainerInstances resource would need to be defined for this to work
            /opt/aws/bin/cfn-init -v --stack ${AWS::StackId} \
              --resource ContainerInstances --configsets full_install \
              --region ${AWS::Region} &

            # Note: ECS agent and Docker are pre-installed in ECS-optimized AMI
            # The instance will automatically register with the ECS cluster after boot

Outputs:
  LaunchTemplateId:
    Description: |
      ID of the created launch template.

      This output can be used by Auto Scaling Groups or EC2 instances to reference
      this specific launch template configuration. The template defines all the
      settings needed for instances to properly join the ECS cluster.
    Value: !Ref LaunchTemplate
    Export:
      # Global export name for use in other CloudFormation stacks
      Name: LaunchTemplateId

  LaunchTemplateVersion:
    Description: |
      Version number of the launch template.

      Launch templates support versioning for rolling updates and rollbacks.
      This output provides the current version for reference by other resources.
      For production, consider using '$Latest' or specific version numbers.
    Value: !GetAtt LaunchTemplate.LatestVersionNumber # Initial version, increment for updates
    Export:
      # Global export name for version tracking
      Name: LaunchTemplateVersion

  # InstanceProfile:
  #   Description: ARN of the ECS instance profile
  #   Value: !GetAtt ECSInstanceProfile.Arn
  #   Export:
  #     Name: InstanceProfileArn
# Template Usage and Operational Notes:
#
# 1. Prerequisites:
#    - VPC and public subnet must exist and be exported by networking stack
#    - ECS cluster must be created before instances attempt to register
#    - SSH key pair must exist in the target AWS region
#    - Proper IAM permissions for CloudFormation deployment
#
# 2. Security Considerations:
#    - Security group allows broad internet access - restrict in production
#    - SSH access (port 22) is open to 0.0.0.0/0 - consider restricting to specific IPs
#    - IMDSv2 is enforced for enhanced instance metadata security
#    - Instance profile follows least privilege with only necessary ECS permissions
#
# 3. Scaling and Performance:
#    - t3.large provides good balance of CPU/memory for mixed workloads
#    - Consider t3.xlarge or compute-optimized instances for CPU-intensive applications
#    - Auto Scaling Groups can use this template for dynamic scaling
#    - EBS optimization is enabled by default on t3 instances
#
# 4. Monitoring and Troubleshooting:
#    - CloudWatch agent is pre-configured via managed policy
#    - ECS agent logs available at /var/log/ecs/ on instances
#    - Docker logs available via 'docker logs' command
#    - Systems Manager Session Manager available for secure shell access
#
# 5. Cost Optimization:
#    - Use Spot instances for development environments
#    - Consider Reserved Instances for stable production workloads
#    - Monitor CloudWatch metrics to right-size instance types
#    - Implement Auto Scaling to match demand patterns
#
# 6. Maintenance:
#    - ECS-optimized AMI is automatically updated via SSM parameter
#    - Plan for regular instance replacement to get latest patches
#    - User data script runs only on first boot - consider configuration management for ongoing updates
#    - Launch template versioning enables safe configuration updates
