# @format
---
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::LanguageExtensions
Description: |
  Ultra-Dynamic Load Balancer Template

  This template uses AWS CloudFormation transforms to dynamically create
  target groups and listener rules based on service configuration arrays,
  eliminating code duplication entirely.

Parameters:
  # Load Balancer Configuration
  LoadBalancerName:
    Type: String
    Description: Name for the Application Load Balancer
    Default: "PortfolioALB"

  LoadBalancerSGCidrIp:
    Type: String
    Description: CIDR block allowed to access the load balancer
    Default: "0.0.0.0/0"

  # SSL Configuration
  SSLCertificateArn:
    Type: String
    Description: ARN of the SSL certificate for HTTPS (optional)
    Default: ""

  EnableHTTPS:
    Type: String
    Description: Enable HTTPS listener with SSL certificate
    Default: "false"
    AllowedValues: ["true", "false"]

  # Services Configuration as JSON Array
  ServicesConfig:
    Type: String
    Description: |
      JSON array of service configurations. Format:
      [
        {
          "name": "portfolio",
          "port": 80,
          "domains": ["example.com", "www.example.com"],
          "priority": 100,
          "enabled": true
        }
      ]
    Default: |
      [
        {
          "name": "portfolio",
          "port": 80,
          "domains": [],
          "priority": 100,
          "enabled": true
        }
      ]

  # Health Check Configuration
  HealthCheckPath:
    Type: String
    Description: Health check path for all target groups
    Default: "/"

  HealthCheckIntervalSeconds:
    Type: Number
    Description: Health check interval in seconds
    Default: 30

  HealthyThresholdCount:
    Type: Number
    Description: Number of consecutive successful health checks
    Default: 2

  UnhealthyThresholdCount:
    Type: Number
    Description: Number of consecutive failed health checks
    Default: 3

Conditions:
  # SSL Conditions
  HasSSLCertificate: !Not [!Equals [!Ref SSLCertificateArn, ""]]
  EnableHTTPSListener:
    !And [!Equals [!Ref EnableHTTPS, "true"], !Condition HasSSLCertificate]

Resources:
  # Load Balancer Security Group
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${LoadBalancerName}-SecurityGroup"
      GroupDescription: !Sub "Security group for ${LoadBalancerName} Application Load Balancer"
      VpcId: !ImportValue VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref LoadBalancerSGCidrIp
          Description: "Allow HTTP traffic"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref LoadBalancerSGCidrIp
          Description: "Allow HTTPS traffic"
        - IpProtocol: tcp
          FromPort: 32768
          ToPort: 61000
          CidrIp: !Ref LoadBalancerSGCidrIp
          Description: "Allow ephemeral ports traffic"
        - IpProtocol: tcp
          FromPort: 49153
          ToPort: 65535
          CidrIp: !Ref LoadBalancerSGCidrIp
          Description: "Allow ephemeral ports traffic"
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 4000
          CidrIp: 10.0.0.0/16
          Description: "Allow outbound to ECS containers"
      Tags:
        - Key: Name
          Value: !Sub "${LoadBalancerName}-SecurityGroup"

  # Application Load Balancer
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Ref LoadBalancerName
      Type: application
      Scheme: internet-facing
      Subnets:
        - !ImportValue PublicSubnet1
        - !ImportValue PublicSubnet2
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "60"
        - Key: routing.http2.enabled
          Value: "true"
        - Key: deletion_protection.enabled
          Value: "false"
      Tags:
        - Key: Name
          Value: !Ref LoadBalancerName

  # HTTP Listener
  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - EnableHTTPSListener
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: 443
              Host: "#{host}"
              Path: "/#{path}"
              Query: "#{query}"
              StatusCode: HTTP_301
          - Type: fixed-response
            FixedResponseConfig:
              StatusCode: 200
              ContentType: "text/plain"
              MessageBody: "Load Balancer is running"

  # HTTPS Listener (conditional)
  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: EnableHTTPSListener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref SSLCertificateArn
      SslPolicy: ELBSecurityPolicy-TLS-1-2-2017-01
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: 404
            ContentType: "text/html"
            MessageBody: |
              <!DOCTYPE html>
              <html>
              <head><title>Service Not Found</title></head>
              <body><h1>404 - Service Not Found</h1></body>
              </html>

  # Dynamic Target Groups using Transform
  "Fn::ForEach::TargetGroups":
    - ServiceConfig
    - !Ref ServicesConfig
    - "${ServiceConfig.name}TargetGroup":
        Type: AWS::ElasticLoadBalancingV2::TargetGroup
        Condition: !Equals [!Ref "${ServiceConfig.enabled}", true]
        Properties:
          Name: !Sub "${ServiceConfig.name}-tg"
          Port: !Ref "${ServiceConfig.port}"
          Protocol: HTTP
          VpcId: !ImportValue VPC
          TargetType: instance
          HealthCheckPort: traffic-port
          HealthCheckEnabled: true
          HealthCheckPath: !Ref HealthCheckPath
          HealthCheckIntervalSeconds: !Ref HealthCheckIntervalSeconds
          HealthyThresholdCount: !Ref HealthyThresholdCount
          UnhealthyThresholdCount: !Ref UnhealthyThresholdCount
          HealthCheckTimeoutSeconds: 5
          HealthCheckProtocol: HTTP
          Matcher:
            HttpCode: "200,302"
          Tags:
            - Key: Name
              Value: !Sub "${ServiceConfig.name} Target Group"
            - Key: Service
              Value: !Ref "${ServiceConfig.name}"

  # Dynamic Listener Rules using Transform
  "Fn::ForEach::ListenerRules":
    - ServiceConfig
    - !Ref ServicesConfig
    - "${ServiceConfig.name}ListenerRule":
        Type: AWS::ElasticLoadBalancingV2::ListenerRule
        Condition: !And
          - !Equals [!Ref "${ServiceConfig.enabled}", true]
          - !Not [!Equals [!Ref "${ServiceConfig.domains}", []]]
        Properties:
          ListenerArn:
            !If [EnableHTTPSListener, !Ref HTTPSListener, !Ref HTTPListener]
          Priority: !Ref "${ServiceConfig.priority}"
          Conditions:
            - Field: host-header
              Values: !Ref "${ServiceConfig.domains}"
          Actions:
            - Type: forward
              TargetGroupArn: !Ref "${ServiceConfig.name}TargetGroup"

Outputs:
  # Load Balancer Outputs
  LoadBalancerArn:
    Description: ARN of the Application Load Balancer
    Value: !Ref ApplicationLoadBalancer
    Export:
      Name: LoadBalancerArn

  LoadBalancerDNSName:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: LoadBalancerDNSName

  LoadBalancerCanonicalHostedZoneID:
    Description: Canonical hosted zone ID of the load balancer
    Value: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
    Export:
      Name: LoadBalancerCanonicalHostedZoneID

  LoadBalancerSecurityGroupId:
    Description: Security Group ID for the Load Balancer
    Value: !Ref LoadBalancerSecurityGroup
    Export:
      Name: LoadBalancerSecurityGroupId

  # Dynamic Target Group Outputs using Transform
  "Fn::ForEach::TargetGroupOutputs":
    - ServiceConfig
    - !Ref ServicesConfig
    - "${ServiceConfig.name}TargetGroupArn":
        Condition: !Equals [!Ref "${ServiceConfig.enabled}", true]
        Description: !Sub "ARN of the ${ServiceConfig.name} Target Group"
        Value: !Ref "${ServiceConfig.name}TargetGroup"
        Export:
          Name: !Sub "${ServiceConfig.name}TargetGroupArn"

  # Listener Outputs
  HTTPListenerArn:
    Description: ARN of the HTTP Listener
    Value: !Ref HTTPListener
    Export:
      Name: HTTPListenerArn

  HTTPSListenerArn:
    Condition: EnableHTTPSListener
    Description: ARN of the HTTPS Listener
    Value: !Ref HTTPSListener
    Export:
      Name: HTTPSListenerArn
