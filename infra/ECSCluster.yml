# @format
---
AWSTemplateFormatVersion: 2010-09-09

Parameters:
  Region:
    Type: String
  ECSClusterNameParam:
    Type: String

Resources:
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ECSClusterNameParam

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-TaskExecutionRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: !Sub "${ProjectName}-TaskExecutionPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - DescribeLogGroups
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${Region}:${AWS::AccountId}:log-group:/ecs/*"
                  - !Sub "arn:aws:logs:${Region}:${AWS::AccountId}:log-group:/aws/ecs/*:log-stream:*"

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inboud access to ECS tasks
      VpcId: !ImportValue VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp
          FromPort: 32768
          ToPort: 65535
          SourceSecurityGroupId: !ImportValue LoadBalancerSGId

        # # HTTPS traffic from ALB (dynamic ports)
        # - IpProtocol: tcp
        #   FromPort: 32768
        #   ToPort: 65535
        #   SourceSecurityGroupId: !ImportValue LoadBalancerSGId

        # - IpProtocol: tcp
        #   FromPort: 3002
        #   ToPort: 3002
        #   CidrIp: 0.0.0.0/0

        # - IpProtocol: tcp
        #   FromPort: 4000
        #   ToPort: 4000
        #   CidrIp: 0.0.0.0/0

Outputs:
  ECSClusterName:
    Value: !Ref ECSCluster
    Export:
      Name: ECSClusterName

  ECSClusterArn:
    Description: ARN of the ECS cluster
    Value: !GetAtt ECSCluster.Arn
    Export:
      Name: ECSClusterArn

  TaskExecutionRoleArn:
    Description: ARN of the ECS task execution role
    Value: !GetAtt TaskExecutionRole.Arn
    Export:
      Name: TaskExecutionRoleArn

  TaskSecurityGroup:
    Value: !Ref TaskSecurityGroup
    Export:
      Name: TaskSecurityGroup
