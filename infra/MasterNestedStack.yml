# @format
---
AWSTemplateFormatVersion: "2010-09-09"
Description: Master Nested Stack to deploy portfolio infrastructure components

Mappings:
  TagMap:
    dev:
      Project: Portfolio
      Owner: Nelson
      CreatedBy: CloudFormation
      CostCenter: DevTeam
    prod:
      Project: Portfolio
      Owner: Nelson
      CreatedBy: CloudFormation
      CostCenter: Production

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
    Description: Deployment environment (dev or prod)

  TemplateBucket:
    Type: String
    Description: S3 Bucket containing the nested templates
  TemplatePrefix:
    Type: String
    Description: Folder path
  ArtifactBucket:
    Type: String
    Description: The S3 bucket used to store build artifacts
  ECSClusterNameParam:
    Type: String
  Region:
    Type: String
  RootDomainName:
    Type: String
  WWWDomainName:
    Type: String
  Project1Domain:
    Type: String
  Project2Domain:
    Type: String
  ProjectFrontendEcommDomain:
    Type: String
  ProjectBackendEcommDomain:
    Type: String
  HostedZoneId:
    Type: String
  CidrIp:
    Type: String
    Default: |
      Use to secure SSH access to the instances from a specific IP or range.

      # Project 2 Dynamic Pipeline Parameters
  PortfolioRepositoryId:
    Type: String
    Description: GitHub repository for main portfolio (owner/repo)

  PortfolioConnectionArn:
    Type: String
    Description: CodeStar connection ARN for main portfolio

  PortfolioContainerName:
    Type: String
    Description: Container name for main portfolio
    Default: portfolio-container

  PortfolioECRRepository:
    Type: String
    Description: ECR repository name for main portfolio
    Default: portfolio-dev

  # Project 1 Dynamic Pipeline Parameters
  Project1RepositoryId:
    Type: String
    Description: GitHub repository for Project 1 (owner/repo)
    Default: Nelson-Lamounier/magic-rainbow-demo

  Project1ConnectionArn:
    Type: String
    Description: CodeStar connection ARN for Project 1

  Project1ContainerName:
    Type: String
    Description: Container name for Project 1
    Default: project1-container

  Project1ECRRepository:
    Type: String
    Description: ECR repository name for Project 1
    Default: project1-dev

    # Project 2 Dynamic Pipeline Parameters
  Project2RepositoryId:
    Type: String
    Description: GitHub repository for Project 2 (owner/repo)

  Project2ConnectionArn:
    Type: String
    Description: CodeStar connection ARN for Project 2

  Project2ContainerName:
    Type: String
    Description: Container name for Project 2
    Default: project2-container

  Project2ECRRepository:
    Type: String
    Description: ECR repository name for Project 2
    Default:
      project2-dev

      # Project fullStack Dynamic Pipeline Parameters
  ProjectFullStackRepositoryId:
    Type: String
    Description: GitHub repository for Project 2 (owner/repo)

  ProjectFullStackConnectionArn:
    Type: String
    Description: CodeStar connection ARN for Project 2

  ProjectFullStackContainerName:
    Type: String
    Description: Container name for Project 2

  ProjectFullStackSecondaryContainerName:
    Type: String
    Description: Container name for Project 2

  ProjectFullStackECRRepository:
    Type: String
    Description: ECR repository name for Project 2
    Default: frontend-ecomm-dev

  ProjectFullStackSecondaryECRRepository:
    Type: String
    Description: ECR repository name for Project 2
    Default: backend-ecomm-dev

  MigrationMode:
    Type: String
    Description: Migration mode for Project 1
    AllowedValues:
      - migrate
      - no-migrate
    Default: migrate
    ConstraintDescription: Must be either 'migrate' or 'no-migrate'

Resources:
  VPCStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}VPC.yml
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  LoadBalancerStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - VPCStack
      - CertificateStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}LoadBalancer.yml
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  LaunchTemplateStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: ECSClusterStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}LaunchTemplate.yml
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment
      Parameters:
        ECSClusterNameParam: !Ref ECSClusterNameParam
        PublicSubnetId: !GetAtt VPCStack.Outputs.PublicSubnet1
        CidrIp: !Ref CidrIp

  ECSClusterStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: LoadBalancerStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}ECSCluster.yml
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment
      Parameters:
        ECSClusterNameParam: !Ref ECSClusterNameParam
        Region: !Ref Region

  ServiceStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ECSClusterStack
      - LoadBalancerStack
      - AutoScalingStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}services/DynamicService.yml
      Parameters:
        ProjectName: Portfolio
        ServiceName: portfolio-service
        ContainerName: !Ref PortfolioContainerName
        ECRRepository: !Ref PortfolioECRRepository
        ContainerPort: 80
        HostPort: 0
        CPU: 256
        Memory: 512
        DesiredCount: 1
        TargetGroupArn: !GetAtt LoadBalancerStack.Outputs.TargetGroupArn
        Region: !Ref Region
        MigrationMode: !Ref MigrationMode
        ExportSuffix: V1
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  Project1ServiceStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ECSClusterStack
      - LoadBalancerStack
      - AutoScalingStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}services/DynamicService.yml
      Parameters:
        ProjectName: Project1
        ServiceName: project1-service
        ContainerName: project1-container
        ECRRepository: !Ref Project1ECRRepository
        ContainerPort: 3000
        HostPort: 0
        CPU: 128
        Memory: 256
        DesiredCount: 1
        TargetGroupArn: !GetAtt LoadBalancerStack.Outputs.Project1TargetGroupArn
        Region: !Ref Region
        MigrationMode: !Ref MigrationMode
        ExportSuffix: V1
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  Project2ServiceStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ECSClusterStack
      - LoadBalancerStack
      - AutoScalingStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}services/DynamicService.yml
      Parameters:
        ProjectName: Project2
        ServiceName: project2-service
        ContainerName: project2-container
        ECRRepository: !Ref Project2ECRRepository
        ContainerPort: 3001
        HostPort: 0
        CPU: 128
        Memory: 256
        DesiredCount: 1
        TargetGroupArn: !GetAtt LoadBalancerStack.Outputs.Project2TargetGroupArn
        Region: !Ref Region
        MigrationMode: !Ref MigrationMode
        ExportSuffix: V1
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  ProjectFullStackServiceStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ECSClusterStack
      - LoadBalancerStack
      - AutoScalingStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}services/DynamicService.yml
      Parameters:
        ProjectName: ProjectFullStack
        ServiceName: fullstack-ecomm-service
        # Primary container (Frontend)
        ContainerName: project-frontend-ecomm-container
        ECRRepository: frontend-ecomm-dev
        ContainerPort: 3002
        HostPort: 0
        CPU: 128
        Memory: 256
        DesiredCount: 1
        TargetGroupArn: !GetAtt LoadBalancerStack.Outputs.ProjectFrontendEcommTargetGroupArn
        # Secondary container (Backend)
        SecondaryContainerName: project-backend-ecomm-container
        SecondaryECRRepository: backend-ecomm-dev
        SecondaryContainerPort: 4000
        SecondaryHostPort: 0
        CPU: 128
        Memory: 256
        DesiredCount: 1
        SecondaryTargetGroupArn: !GetAtt LoadBalancerStack.Outputs.ProjectBackendEcommTargetGroupArn
        # Resources
        Region: !Ref Region
        MigrationMode: !Ref MigrationMode
        ExportSuffix: V1
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  AutoScalingStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - LaunchTemplateStack
      - ECSClusterStack
      - VPCStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}AutoScalingGroup.yml
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  DNSStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: LoadBalancerStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}dns.yml
      Parameters:
        RootDomainName: !Ref RootDomainName
        WWWDomainName: !Ref WWWDomainName
        Project1Domain: !Ref Project1Domain
        Project2Domain: !Ref Project2Domain
        ProjectFrontendEcommDomain: !Ref ProjectFrontendEcommDomain
        ProjectBackendEcommDomain: !Ref ProjectBackendEcommDomain
        HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  CertificateStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}certificate.yml
      Parameters:
        RootDomainName: !Ref RootDomainName
        WWWDomainName: !Ref WWWDomainName
        Project1DomainName: !Ref Project1Domain
        Project2DomainName: !Ref Project2Domain
        ProjectFEDomainName: !Ref ProjectFrontendEcommDomain
        ProjectBEDomainName: !Ref ProjectBackendEcommDomain
        HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

    # Add IAM stacks BEFORE pipeline stacks
  CodeBuildPoliciesStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}iam/CodeBuildPolicies.yml
      Parameters:
        ArtifactBucket: !Ref ArtifactBucket
        ProjectName: !FindInMap [TagMap, !Ref Environment, Project]
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  CodePipelinePoliciesStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}iam/CodePipelinePolicies.yml
      Parameters:
        ArtifactBucket: !Ref ArtifactBucket
        ProjectName: !FindInMap [TagMap, !Ref Environment, Project]
        ConnectionArn: !Ref Project1ConnectionArn
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  PipelineStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ServiceStack #  Pipeline needs the service first
      - CodeBuildPoliciesStack #  Pipeline needs CodeBuild IAM role
      - CodePipelinePoliciesStack #  Pipeline needs CodePipeline IAM role
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}pipelines/DynamicPipeline.yml
      Parameters:
        ArtifactBucket: !Ref ArtifactBucket
        ServiceName: !GetAtt ServiceStack.Outputs.ECSServiceName
        ProjectName: Portfolio
        RepositoryId: !Ref PortfolioRepositoryId
        ConnectionArn: !Ref PortfolioConnectionArn
        ContainerName: !Ref PortfolioContainerName
        ECRRepositoryName: !Ref PortfolioECRRepository
        TemplateBucket: !Ref TemplateBucket
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  Project1PipelineStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - Project1ServiceStack #  Pipeline needs the service first
      - CodeBuildPoliciesStack #  Pipeline needs CodeBuild IAM role
      - CodePipelinePoliciesStack #  Pipeline needs CodePipeline IAM role
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}pipelines/DynamicPipeline.yml
      Parameters:
        ArtifactBucket: !Ref ArtifactBucket
        ServiceName: !GetAtt Project1ServiceStack.Outputs.ECSServiceName
        ProjectName: Project1
        RepositoryId: !Ref Project1RepositoryId
        ConnectionArn: !Ref Project1ConnectionArn
        ContainerName: !Ref Project1ContainerName
        ECRRepositoryName: !Ref Project1ECRRepository
        TemplateBucket: !Ref TemplateBucket
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  Project2PipelineStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - Project2ServiceStack
      - CodeBuildPoliciesStack
      - CodePipelinePoliciesStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}pipelines/DynamicPipeline.yml
      Parameters:
        ArtifactBucket: !Ref ArtifactBucket
        ServiceName: !GetAtt Project2ServiceStack.Outputs.ECSServiceName
        ProjectName: Project2
        RepositoryId: !Ref Project2RepositoryId
        ConnectionArn: !Ref Project2ConnectionArn
        ContainerName: !Ref Project2ContainerName
        ECRRepositoryName: !Ref Project2ECRRepository
        TemplateBucket: !Ref TemplateBucket
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  ProjectFullStackPipelineStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ProjectFullStackServiceStack
      - CodeBuildPoliciesStack
      - CodePipelinePoliciesStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}pipelines/DynamicPipeline.yml
      Parameters:
        ArtifactBucket: !Ref ArtifactBucket
        ServiceName: fullstack-ecomm-service
        ProjectName: ProjectFullStack
        RepositoryId: !Ref ProjectFullStackRepositoryId # Add this parameter
        ConnectionArn: !Ref ProjectFullStackConnectionArn # Add this parameter
        ContainerName: project-frontend-ecomm-container
        SecondaryContainerName: project-backend-ecomm-container
        ECRRepositoryName: frontend-ecomm-dev
        SecondaryECRRepositoryName: backend-ecomm-dev
        TemplateBucket: !Ref TemplateBucket
        ProjectType: full-stack
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment
