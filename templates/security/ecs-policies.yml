# @format
---
AWSTemplateFormatVersion: "2010-09-09"
Description: IAM roles and policies for ECS services

Parameters:
  Environment:
    Type: String
    Description: Environment name for resource naming and isolation
    Default: "dev"
    AllowedValues: ["dev", "staging", "production"]

Resources:
  # ECS Task Execution Role (used by ECS agent)
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "ECS-TaskExecutionRole-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: !Sub "ECS-TaskExecutionPolicy-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${Environment}/*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/ecs/${Environment}/*"
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "ECS-TaskExecutionRole-${Environment}"
        - Key: Environment
          Value: !Ref Environment

  # ECS Task Role (used by application code)
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "ECS-TaskRole-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "ECS-TaskPolicy-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${Environment}/*"
      Tags:
        - Key: Name
          Value: !Sub "ECS-TaskRole-${Environment}"
        - Key: Environment
          Value: !Ref Environment

Outputs:
  TaskExecutionRoleArn:
    Description: ARN of the ECS task execution role
    Value: !GetAtt TaskExecutionRole.Arn
    Export:
      Name: !Sub "TaskExecutionRoleArn-${Environment}"

  TaskExecutionRoleName:
    Description: Name of the ECS task execution role
    Value: !Ref TaskExecutionRole
    Export:
      Name: !Sub "TaskExecutionRoleName-${Environment}"

  TaskRoleArn:
    Description: ARN of the ECS task role
    Value: !GetAtt TaskRole.Arn
    Export:
      Name: !Sub "TaskRoleArn-${Environment}"

  TaskRoleName:
    Description: Name of the ECS task role
    Value: !Ref TaskRole
    Export:
      Name: !Sub "TaskRoleName-${Environment}"