# @format
AWSTemplateFormatVersion: "2010-09-09"

Description: |
  Ultra-Dynamic CodePipeline IAM Role and Policies Template for Multi-Environment Support

  This template creates environment-specific IAM roles with dynamic permissions 
  based on environment configuration, eliminating code duplication while ensuring
  proper security isolation between dev, staging, and production environments.

Parameters:
  # Environment Parameter - Core for all resource naming
  Environment:
    Type: String
    Description: Environment name for resource naming and permission isolation
    Default: "dev"
    AllowedValues: ["dev", "staging", "production"]

  # Project Configuration
  ProjectName:
    Type: String
    Description: Unique project identifier for creating distinct role names
    Default: "Portfolio"

  # Infrastructure Configuration
  ArtifactBucket:
    Description: S3 bucket name for storing pipeline artifacts (will be environment-specific)
    Type: String

  # CodeStar Connection Configuration
  ConnectionArn:
    Description: ARN of the CodeStar connection for GitHub integration
    Type: String

  # Optional Task Execution Role
  TaskExecutionRoleArn:
    Description: ARN of the ECS Task Execution Role
    Type: String
    Default: ""

  # KMS Configuration
  KMSKeyArn:
    Description: KMS key ARN for encrypting artifacts and parameters
    Type: String
    Default: ""

Mappings:
  # Environment-specific configurations
  EnvironmentMap:
    dev:
      LogRetentionDays: 7
      ArtifactRetentionDays: 30
      RequireApproval: false
      AllowCrossRegion: true
    staging:
      LogRetentionDays: 14
      ArtifactRetentionDays: 60
      RequireApproval: true
      AllowCrossRegion: true
    production:
      LogRetentionDays: 90
      ArtifactRetentionDays: 365
      RequireApproval: true
      AllowCrossRegion: false

Conditions:
  # Environment-specific conditions
  IsProduction: !Equals [!Ref Environment, "production"]
  IsStaging: !Equals [!Ref Environment, "staging"]
  IsDevelopment: !Equals [!Ref Environment, "dev"]
  
  # Feature conditions
  HasTaskExecutionRole: !Not [!Equals [!Ref TaskExecutionRoleArn, ""]]
  HasKMSKey: !Not [!Equals [!Ref KMSKeyArn, ""]]
  RequiresApproval: !FindInMap [EnvironmentMap, !Ref Environment, RequireApproval]
  AllowsCrossRegion: !FindInMap [EnvironmentMap, !Ref Environment, AllowCrossRegion]

Resources:
  # Enhanced CodePipeline Role with better security
  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      # Environment-specific role naming
      RoleName: !Sub "${ProjectName}-CodePipelineRole-${Environment}"
      Path: !Sub "/${Environment}/"
      Description: !Sub "CodePipeline IAM role for ${ProjectName} in ${Environment}"
      
      # Enhanced trust policy with stricter conditions
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:RequestedRegion": !Ref AWS::Region
                "aws:userid": !Sub "${AWS::AccountId}:*"
              IpAddress:
                "aws:SourceIp": 
                  - "52.0.0.0/8"  # AWS IP ranges
                  - "54.0.0.0/8"

      # Add permissions boundary for production
      PermissionsBoundary: !If
        - IsProduction
        - !Sub "arn:aws:iam::${AWS::AccountId}:policy/${ProjectName}-PipelineBoundary-${Environment}"
        - !Ref AWS::NoValue

      # Enhanced session duration
      MaxSessionDuration: !If [IsProduction, 14400, 7200]  # 4 hours for prod, 2 hours for dev

      Policies:
        # Enhanced S3 Access Policy with better conditions
        - PolicyName: !Sub "S3Access-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${ArtifactBucket}-${Environment}"
                  - !Sub "arn:aws:s3:::${ArtifactBucket}-${Environment}/*"
                Condition:
                  StringEquals:
                    "s3:ExistingObjectTag/Environment": !Ref Environment
              
              # Enhanced KMS permissions with conditions
              - !If
                - HasKMSKey
                - Effect: Allow
                  Action:
                    - kms:Decrypt
                    - kms:GenerateDataKey
                    - kms:DescribeKey
                  Resource: !Ref KMSKeyArn
                  Condition:
                    StringEquals:
                      "kms:ViaService": !Sub "s3.${AWS::Region}.amazonaws.com"
                - !Ref AWS::NoValue

        # Enhanced ECS Access Policy with tighter scoping
        - PolicyName: !Sub "ECSAccess-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:UpdateService
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                  - ecs:ListTasks
                  - ecs:DescribeTasks
                  - ecs:DescribeClusters
                Resource:
                  - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${Environment}-*"
                  - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${Environment}-*:*"
                  - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ProjectName}-*-${Environment}"
                Condition:
                  StringEquals:
                    "ecs:cluster": !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ProjectName}-ECSCluster-${Environment}"

        # Enhanced SSM Parameter Access Policy with path restrictions
        - PolicyName: !Sub "SSMAccess-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  # Environment-specific parameters only
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Environment}/*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Environment}/${ProjectName}/*"
                Condition:
                  StringEquals:
                    "ssm:SourceIp": 
                      - "52.0.0.0/8"  # AWS IP ranges only

        # Enhanced IAM PassRole Policy with strict resource limits
        - PolicyName: !Sub "IAMPassRole-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !If
                    - HasTaskExecutionRole
                    - !Ref TaskExecutionRoleArn
                    - !Sub "arn:aws:iam::${AWS::AccountId}:role/${Environment}/*TaskExecutionRole"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/ecsTaskExecutionRole"
                Condition:
                  StringEquals:
                    "iam:PassedToService": "ecs-tasks.amazonaws.com"

        # Enhanced Source Control Access Policy
        - PolicyName: !Sub "SourceAccess-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                  - codestar-connections:PassConnection
                Resource: !Ref ConnectionArn
                Condition:
                  StringEquals:
                    "codestar-connections:ProviderType": "GitHub"

        # Production-specific enhanced audit policy
        - !If
          - IsProduction
          - PolicyName: "ProductionAuditAccess"
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - cloudtrail:LookupEvents
                  Resource: "*"
                  Condition:
                    DateGreaterThan:
                      "aws:CurrentTime": "2024-01-01T00:00:00Z"
                - Effect: Allow
                  Action:
                    - cloudwatch:PutMetricData
                  Resource: !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:metric/Custom/Pipeline/*"
                - Effect: Allow
                  Action:
                    - sns:Publish
                  Resource: !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ProjectName}-*-${Environment}"
          - !Ref AWS::NoValue

      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-CodePipelineRole-${Environment}"
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: "CodePipeline IAM Role"
        - Key: ManagedBy
          Value: "CloudFormation"

Outputs:
  # Environment-specific outputs
  CodePipelineRoleArn:
    Description: ARN of the CodePipeline IAM role
    Value: !GetAtt CodePipelineRole.Arn
    Export:
      Name: !Sub "${ProjectName}-CodePipelineRoleArn-${Environment}"

  CodePipelineRoleName:
    Description: Name of the CodePipeline IAM role
    Value: !Ref CodePipelineRole
    Export:
      Name: !Sub "${ProjectName}-CodePipelineRoleName-${Environment}"

  EnvironmentRoleInfo:
    Description: Environment-specific role configuration summary
    Value: !Sub |
      Environment: ${Environment}
      Project: ${ProjectName}
      Role: ${CodePipelineRole}
      Artifact Bucket: ${ArtifactBucket}-${Environment}
      Log Retention: ${EnvironmentMap.${Environment}.LogRetentionDays} days
    Export:
      Name: !Sub "CodePipelineRoleInfo-${Environment}"
