# @format
AWSTemplateFormatVersion: "2010-09-09"

Description: |
  Reusable CodeBuild IAM Role and Policies Template

  This template creates a standardized IAM role with the necessary permissions for CodeBuild projects
  to build Docker images, push to ECR, access S3 artifacts, and retrieve sensitive parameters from SSM.

  Usage: Deploy this as a nested stack from your main pipeline templates to ensure consistent
  permissions across all CodeBuild projects while maintaining security best practices.

Parameters:
  ArtifactBucket:
    Description: |
      S3 bucket name where CodePipeline stores build artifacts and intermediate files.
      This bucket is shared across all pipeline stages for artifact passing.
    Type: String

  ProjectName:
    Description: |
      Unique identifier for the project (e.g., 'Portfolio', 'Project1', 'Project2').
      Used to create unique role names and avoid conflicts when deploying multiple pipelines.
      Should match the naming convention used in your service stacks.
    Type: String

Resources:
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:

      # Create unique role name to prevent conflicts between different project pipelines
      RoleName: !Sub ${ProjectName}-CodeBuildRole

      # Trust policy: Allow CodeBuild service to assume this role during build execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole

      # AWS managed policies for common CodeBuild operations
      ManagedPolicyArns:

        # Provides full access to ECR for Docker image operations (push/pull/tag)
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser

        # Provides CodeBuild service permissions for builds, logs, and VPC operations
        - arn:aws:iam::aws:policy/AWSCodeBuildDeveloperAccess
      Policies:

        # S3 Access Policy: Enables CodeBuild to read source code and store build artifacts
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject # Download source code and dependencies from S3
                  - s3:PutObject # Upload build artifacts to S3# Upload build artifacts (like imagedefinitions.json)
                  - s3:ListBucket # List bucket contents for artifact discovery
                Resource:

                  # Grant access to the specific artifact bucket and all objects within it
                  - !Sub arn:aws:s3:::${ArtifactBucket}
                  - !Sub arn:aws:s3:::${ArtifactBucket}/*

        # CloudWatch Logs Policy: Enables CodeBuild to create and write to log streams
        - PolicyName: LoggingPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup # Create log groups for build projects
                  - logs:CreateLogStream # Create individual log streams for each build
                  - logs:PutLogEvents # Write build logs and error messages

                # Allow access to all CloudWatch logs (CodeBuild manages log group naming)
                Resource: '*'

        # SSM Parameter Store Policy: Secure access to sensitive configuration values
        - PolicyName: SSMParameterPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter # Retrieve individual parameter values
                  - ssm:GetParameters # Retrieve multiple parameters in batch
                  - kms:Decrypt # Decrypt SecureString parameters encrypted with KMS
                Resource:

                  # Specific parameters needed for source control and container registry access
                  # GitHub token: For accessing private repositories during source checkout
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/github/token

                  # DockerHub credentials: For pulling base images from DockerHub (if needed)
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dockerhub/password
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dockerhub/username

Outputs:
  CodeBuildRoleArn:
    Description: |
      ARN of the created CodeBuild IAM role.

      This output is used by pipeline templates to assign the role to CodeBuild projects.
      The role ARN is exported with a unique name to prevent conflicts between projects.
    Value: !GetAtt CodeBuildRole.Arn
    Export:

      # Export with project-specific name for use in other stacks
      # Format: {ProjectName}-CodeBuildRoleArn (e.g., Portfolio-CodeBuildRoleArn)
      Name: Portfolio-CodeBuildRoleArn
