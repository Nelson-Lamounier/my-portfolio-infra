# @format
AWSTemplateFormatVersion: "2010-09-09"

Description: |
  Ultra-Dynamic CodeBuild IAM Role and Policies Template for Multi-Environment Support

  This template creates environment-specific IAM roles with dynamic permissions 
  based on environment configuration, eliminating code duplication while ensuring
  proper security isolation between dev, staging, and production environments.

Parameters:
  # Environment Parameter
  Environment:
    Type: String
    Description: Environment name for resource naming and permission isolation
    Default: "dev"
    AllowedValues: ["dev", "staging", "production"]

  # Projects Configuration as JSON Array
  ProjectsConfig:
    Description: |
      JSON array of project configurations for dynamic role creation. Format:
      [
        {
          "name": "Portfolio",
          "ecrRepositories": ["portfolio-app"],
          "enabled": true
        },
        {
          "name": "Project1", 
          "ecrRepositories": ["project1-app"],
          "enabled": true
        }
      ]
    Type: String
    Default: |
      [
        {
          "name": "Portfolio",
          "ecrRepositories": ["portfolio-app"],
          "enabled": true
        }
      ]

  # Infrastructure Configuration
  ArtifactBucket:
    Description: S3 bucket name for storing build artifacts (will be environment-specific)
    Type: String

  # KMS Configuration
  KMSKeyArn:
    Description: KMS key ARN for encrypting artifacts and parameters
    Type: String
    Default: ""

Conditions:
  # Environment-specific conditions
  IsProduction: !Equals [!Ref Environment, "production"]
  IsStaging: !Equals [!Ref Environment, "staging"]
  IsDevelopment: !Equals [!Ref Environment, "dev"]
  
  # Feature conditions
  HasKMSKey: !Not [!Equals [!Ref KMSKeyArn, ""]]

Transform: AWS::LanguageExtensions

Resources:
  # Enhanced CodeBuild Roles with better security
  Fn::ForEach::CodeBuildRoles:
    - ProjectConfig
    - !Ref ProjectsConfig
    - ${ProjectConfig.name}CodeBuildRole:
        Type: AWS::IAM::Role
        Condition: !Equals
          - !Ref ${ProjectConfig.enabled}
          - true
        Properties:
          RoleName: !Sub "${ProjectConfig.name}-CodeBuildRole-${Environment}"
          Path: !Sub "/${Environment}/"
          Description: !Sub "CodeBuild IAM role for ${ProjectConfig.name} in ${Environment} environment"
          
          # Enhanced trust policy with conditions
          AssumeRolePolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Principal:
                  Service: codebuild.amazonaws.com
                Action: sts:AssumeRole
                Condition:
                  StringEquals:
                    "aws:RequestedRegion": !Ref AWS::Region
                  StringLike:
                    "aws:userid": !Sub "${AWS::AccountId}:*"

          # More restrictive managed policies
          ManagedPolicyArns:
            - !If
              - IsProduction
              - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
              - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser

          Policies:
            # Enhanced S3 Access Policy with better scoping
            - PolicyName: !Sub "S3AccessPolicy-${Environment}"
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Action:
                      - s3:GetObject
                      - s3:PutObject
                      - s3:ListBucket
                    Resource:
                      - !Sub "arn:aws:s3:::${ArtifactBucket}-${Environment}"
                      - !Sub "arn:aws:s3:::${ArtifactBucket}-${Environment}/*"
                    Condition:
                      StringEquals:
                        "s3:ExistingObjectTag/Environment": !Ref Environment
                  
                  # Separate statement for delete operations (production only)
                  - !If
                    - IsProduction
                    - Effect: Allow
                      Action:
                        - s3:DeleteObject
                      Resource: !Sub "arn:aws:s3:::${ArtifactBucket}-${Environment}/*"
                      Condition:
                        StringEquals:
                          "s3:ExistingObjectTag/CanDelete": "true"
                    - Effect: Allow
                      Action:
                        - s3:DeleteObject
                      Resource: !Sub "arn:aws:s3:::${ArtifactBucket}-${Environment}/*"

            # Enhanced ECR Access Policy with specific repository access
            - PolicyName: !Sub "ECRAccessPolicy-${Environment}"
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  # Repository-specific permissions
                  - Effect: Allow
                    Action:
                      - ecr:BatchCheckLayerAvailability
                      - ecr:GetDownloadUrlForLayer
                      - ecr:BatchGetImage
                      - ecr:PutImage
                      - ecr:InitiateLayerUpload
                      - ecr:UploadLayerPart
                      - ecr:CompleteLayerUpload
                    Resource:
                      Fn::ForEach::ECRResources:
                        - EcrRepo
                        - !Ref ${ProjectConfig.ecrRepositories}
                        - !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepo}-${Environment}"
                  
                  # Global ECR token access (required)
                  - Effect: Allow
                    Action:
                      - ecr:GetAuthorizationToken
                    Resource: "*"

            # Enhanced CloudWatch Logs Policy with specific log groups
            - PolicyName: !Sub "LoggingPolicy-${Environment}"
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Action:
                      - logs:CreateLogGroup
                      - logs:CreateLogStream
                      - logs:PutLogEvents
                    Resource:
                      - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectConfig.name}-${Environment}-*"
                      - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectConfig.name}-${Environment}-*:*"

            # Enhanced SSM Parameter Policy with path-based access
            - PolicyName: !Sub "SSMParameterPolicy-${Environment}"
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Action:
                      - ssm:GetParameter
                      - ssm:GetParameters
                      - ssm:GetParametersByPath
                    Resource:
                      # Environment-specific parameters
                      - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Environment}/*"
                      # Project-specific parameters
                      - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Environment}/${ProjectConfig.name}/*"
                  
                  # KMS access for SecureString parameters
                  - !If
                    - HasKMSKey
                    - Effect: Allow
                      Action:
                        - kms:Decrypt
                        - kms:DescribeKey
                      Resource: !Ref KMSKeyArn
                      Condition:
                        StringEquals:
                          "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com"
                    - !Ref AWS::NoValue

            # Enhanced ECS Update Policy with specific service access
            - PolicyName: !Sub "ECSUpdatePolicy-${Environment}"
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Action:
                      - ecs:UpdateService
                      - ecs:DescribeServices
                      - ecs:DescribeTasks
                      - ecs:DescribeTaskDefinition
                    Resource:
                      - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${Environment}-${ProjectConfig.name}-*"
                      - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${Environment}-${ProjectConfig.name}-*"

          Tags:
            - Key: Name
              Value: !Sub "${ProjectConfig.name}-CodeBuildRole-${Environment}"
            - Key: Environment
              Value: !Ref Environment
            - Key: Project
              Value: !Ref ${ProjectConfig.name}
            - Key: Purpose
              Value: "CodeBuild IAM Role"
            - Key: ManagedBy
              Value: "CloudFormation"

  # Common CodeBuild Service Role (shared across projects in same environment)
  CommonCodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "Common-CodeBuildRole-${Environment}"
      Path: !Sub "/${Environment}/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      
      # Minimal common permissions
      Policies:
        - PolicyName: "CommonCodeBuildPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/common-${Environment}-*"
      
      Tags:
        - Key: Name
          Value: !Sub "Common-CodeBuildRole-${Environment}"
        - Key: Environment
          Value: !Ref Environment

Outputs:
  # Dynamic Role Outputs
  Fn::ForEach::RoleOutputs:
    - ProjectConfig
    - !Ref ProjectsConfig
    - ${ProjectConfig.name}CodeBuildRoleArn:
        Condition: !Equals
          - !Ref ${ProjectConfig.enabled}
          - true
        Description: !Sub "ARN of the ${ProjectConfig.name} CodeBuild IAM role for ${Environment}"
        Value: !GetAtt ${ProjectConfig.name}CodeBuildRole.Arn
        Export:
          Name: !Sub "${ProjectConfig.name}-CodeBuildRoleArn-${Environment}"

  # Common role output
  CommonCodeBuildRoleArn:
    Description: "ARN of the common CodeBuild IAM role"
    Value: !GetAtt CommonCodeBuildRole.Arn
    Export:
      Name: !Sub "Common-CodeBuildRoleArn-${Environment}"

  # Environment summary
  EnvironmentRoleInfo:
    Description: "Environment-specific CodeBuild role configuration summary"
    Value: !Sub |
      Environment: ${Environment}
      Projects: ${ProjectsConfig}
      Artifact Bucket: ${ArtifactBucket}-${Environment}
      KMS Key: ${KMSKeyArn}
    Export:
      Name: !Sub "CodeBuildRoleInfo-${Environment}"
