# @format
AWSTemplateFormatVersion: "2010-09-09"

Description: |
  Ultra-Dynamic Load Balancer Template

  This template uses AWS CloudFormation transforms to dynamically create
  target groups and listener rules based on service configuration arrays,
  eliminating code duplication entirely.

Parameters:
  # Environment Parameter
  Environment:
    Type: String
    Description: Environment name for resource naming and isolation
    Default: "dev"
    AllowedValues: ["dev", "staging", "production"]

  # Load Balancer Configuration
  LoadBalancerName:
    Description: Name for the Application Load Balancer
    Type: String
    Default: PortfolioALB

  LoadBalancerSGCidrIp:
    Description: CIDR block allowed to access the load balancer
    Type: String
    Default: 0.0.0.0/0

  # SSL Configuration
  SSLCertificateArn:
    Description: ARN of the SSL certificate for HTTPS (optional)
    Type: String
    Default: ""

  EnableHTTPS:
    Description: Enable HTTPS listener with SSL certificate
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "false"

  # Services Configuration as JSON Array
  ServicesConfig:
    Description: |
      JSON array of service configurations. Format:
      [
        {
          "name": "portfolio",
          "port": 80,
          "domains": ["example.com", "www.example.com"],
          "priority": 100,
          "enabled": true
        }
      ]
    Type: String
    Default: |
      [
        {
          "name": "portfolio",
          "port": 80,
          "domains": [],
          "priority": 100,
          "enabled": true
        }
      ]

  # Health Check Configuration
  HealthCheckPath:
    Description: Health check path for all target groups
    Type: String
    Default: /

  HealthCheckIntervalSeconds:
    Description: Health check interval in seconds
    Type: Number
    Default: 30

  HealthyThresholdCount:
    Description: Number of consecutive successful health checks
    Type: Number
    Default: 2

  UnhealthyThresholdCount:
    Description: Number of consecutive failed health checks
    Type: Number
    Default: 3

  # Project Name Parameter
  ProjectName:
    Type: String
    Description: Project name for resource naming
    Default: "Portfolio"

Conditions:
  # SSL Conditions
  HasSSLCertificate: !Not
    - !Equals
      - !Ref SSLCertificateArn
      - ""

  EnableHTTPSListener: !And
    - !Equals
      - !Ref EnableHTTPS
      - "true"
    - !Condition HasSSLCertificate

  # Environment-specific conditions
  IsProduction: !Equals [!Ref Environment, "production"]
  IsDevOrStaging: !Not [!Condition IsProduction]

Transform: AWS::LanguageExtensions

Resources:

  # Enhanced Load Balancer Security Group
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-${LoadBalancerName}-SecurityGroup-${Environment}"
      GroupDescription: !Sub "Security group for ${LoadBalancerName} Application Load Balancer in ${Environment}"
      VpcId: !ImportValue 
        Fn::Sub: "${ProjectName}-VPC-${Environment}"
      SecurityGroupIngress:
        # Only allow standard web traffic from internet
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref LoadBalancerSGCidrIp
          Description: "Allow HTTP traffic from internet"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref LoadBalancerSGCidrIp
          Description: "Allow HTTPS traffic from internet"

      SecurityGroupEgress:
        # Outbound to ECS containers - use CidrIp for VPC range
        - IpProtocol: tcp
          FromPort: 32768
          ToPort: 65535
          CidrIp: !ImportValue 
            Fn::Sub: "${ProjectName}-VpcCidr-${Environment}"
          Description: "Allow outbound to ECS containers on ephemeral ports"
        # Outbound for health checks on specific application ports
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 4000
          CidrIp: !ImportValue 
            Fn::Sub: "${ProjectName}-VpcCidr-${Environment}"
          Description: "Allow health checks to application services"

  # Add ECS Security Group that references ALB Security Group
  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${LoadBalancerName}-ECS-SecurityGroup-${Environment}"
      GroupDescription: !Sub "Security group for ECS containers behind ALB in ${Environment}"
      VpcId: !ImportValue 
        Fn::Sub: "VPC-${Environment}"
      SecurityGroupIngress:
        # Use SourceSecurityGroupId for ALB-to-ECS communication
        - IpProtocol: tcp
          FromPort: 32768
          ToPort: 65535
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: "Allow traffic from ALB on ephemeral ports"
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 4000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: "Allow health checks from ALB"
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: "Allow health checks from ALB to portfolio"

  # Enhanced Application Load Balancer
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-${LoadBalancerName}-${Environment}"
      Type: application
      Scheme: internet-facing
      Subnets:
        - !ImportValue 
          Fn::Sub: "${ProjectName}-PublicSubnet1-${Environment}"
        - !ImportValue 
          Fn::Sub: "${ProjectName}-PublicSubnet2-${Environment}"
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      LoadBalancerAttributes:
        # Environment-specific settings
        - Key: idle_timeout.timeout_seconds
          Value: !If [IsProduction, "300", "60"]  # Longer timeout for production
        - Key: routing.http2.enabled
          Value: "true"
        - Key: deletion_protection.enabled
          Value: !If [IsProduction, "true", "false"]  # Protect production ALB
        - Key: access_logs.s3.enabled
          Value: !If [IsProduction, "true", "false"]  # Enable access logs in production
        # Add WAF for production
        - Key: waf.fail_open.enabled
          Value: !If [IsProduction, "false", "true"]

  # HTTP Listener
  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - EnableHTTPSListener
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: 443
              Host: '#{host}'
              Path: /#{path}
              Query: '#{query}'
              StatusCode: HTTP_301
          - Type: fixed-response
            FixedResponseConfig:
              StatusCode: 200
              ContentType: text/plain
              MessageBody: !Sub |
                <!DOCTYPE html>
                <html>
                <head><title>${Environment} Load Balancer</title></head>
                <body>
                  <h1>Portfolio Infrastructure - ${Environment}</h1>
                  <p>Load Balancer is running</p>
                </body>
                </html>

  # HTTPS Listener (conditional)
  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates: !ImportValue 
            Fn::Sub: "SSLCertificateArn-${Environment}"
      SslPolicy: ELBSecurityPolicy-TLS-1-2-2017-01
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: 404
            ContentType: text/html
            MessageBody: |
              <!DOCTYPE html>
              <html>
              <head><title>Service Not Found</title></head>
              <body><h1>404 - Service Not Found</h1></body>
              </html>
    Condition: EnableHTTPSListener

  # Enhanced Target Groups with better health checks
  Fn::ForEach::TargetGroups:
    - ServiceConfig
    - !Ref ServicesConfig
    - ${ServiceConfig.name}TargetGroup:
        Type: AWS::ElasticLoadBalancingV2::TargetGroup
        Properties:
          # Include environment in target group naming
          Name: !Sub "${ProjectName}-${ServiceConfig.name}-tg-${Environment}"
          Port: !Ref ${ServiceConfig.port}
          Protocol: HTTP
          VpcId: !ImportValue 
            Fn::Sub: "${ProjectName}-VPC-${Environment}"
          TargetType: instance
          HealthCheckEnabled: true
          HealthCheckPath: !Sub "/${ServiceConfig.name}/health"  # Service-specific health check
          # Environment-specific health check settings
          HealthCheckIntervalSeconds: !If [IsProduction, 30, 60]
          HealthyThresholdCount: !If [IsProduction, 3, 2]
          UnhealthyThresholdCount: !If [IsProduction, 2, 3]
          HealthCheckTimeoutSeconds: 5
          HealthCheckProtocol: HTTP
          Matcher:
            HttpCode: "200,302"
          TargetGroupAttributes:
            - Key: deregistration_delay.timeout_seconds
              Value: !If [IsProduction, "300", "30"]
            - Key: slow_start.duration_seconds
              Value: !If [IsProduction, "30", "0"]

  # Dynamic Listener Rules using Transform
  Fn::ForEach::ListenerRules:
    - ServiceConfig
    - !Ref ServicesConfig
    - ${ServiceConfig.name}ListenerRule:
        Type: AWS::ElasticLoadBalancingV2::ListenerRule
        Condition: !And
          - !Equals
            - !Ref ${ServiceConfig.enabled}
            - true
          - !Not
            - !Equals
              - !Ref ${ServiceConfig.domains}
              - []
        Properties:
          ListenerArn: !If
            - EnableHTTPSListener
            - !Ref HTTPSListener
            - !Ref HTTPListener
          Priority: !Ref ${ServiceConfig.priority}
          Conditions:
            - Field: host-header
              Values: !Ref ${ServiceConfig.domains}
          Actions:
            - Type: forward
              TargetGroupArn: !Ref ${ServiceConfig.name}TargetGroup

Outputs:
  # Load Balancer Outputs with environment-specific exports
  LoadBalancerArn:
    Description: ARN of the Application Load Balancer
    Value: !Ref ApplicationLoadBalancer
    Export:
      Name: !Sub "LoadBalancerArn-${Environment}"

  LoadBalancerDNSName:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub "LoadBalancerDNSName-${Environment}"

  LoadBalancerCanonicalHostedZoneID:
    Description: Canonical hosted zone ID of the load balancer
    Value: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub "LoadBalancerCanonicalHostedZoneID-${Environment}"

  LoadBalancerSecurityGroupId:
    Description: Security Group ID for the Load Balancer
    Value: !Ref LoadBalancerSecurityGroup
    Export:
      Name: !Sub "LoadBalancerSGId-${Environment}"

  # Dynamic Target Group Outputs using Transform
  Fn::ForEach::TargetGroupOutputs:
    - ServiceConfig
    - !Ref ServicesConfig
    - ${ServiceConfig.name}TargetGroupArn:
        Condition: !Equals
          - !Ref ${ServiceConfig.enabled}
          - true
        Description: !Sub "ARN of the ${ServiceConfig.name} Target Group"
        Value: !Ref ${ServiceConfig.name}TargetGroup
        Export:
          Name: !Sub "${ServiceConfig.name}TargetGroupArn-${Environment}"

  # Listener Outputs
  HTTPListenerArn:
    Description: ARN of the HTTP Listener
    Value: !Ref HTTPListener
    Export:
      Name: !Sub "HTTPListenerArn-${Environment}"

  HTTPSListenerArn:
    Description: ARN of the HTTPS Listener
    Value: !Ref HTTPSListener
    Export:
      Name: !Sub "HTTPSListenerArn-${Environment}"
    Condition: EnableHTTPSListener

  ECSSecurityGroupId:
    Description: Security Group ID for ECS containers
    Value: !Ref ECSSecurityGroup
    Export:
      Name: !Sub "ECSSecurityGroupId-${Environment}"
