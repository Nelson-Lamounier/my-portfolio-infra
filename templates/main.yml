# @format
---
AWSTemplateFormatVersion: "2010-09-09"
Description: Master Nested Stack to deploy portfolio infrastructure components

Mappings:
  TagMap:
    dev:
      Project: Portfolio
      Owner: Nelson
      CreatedBy: CloudFormation
      CostCenter: DevTeam
    prod:
      Project: Portfolio
      Owner: Nelson
      CreatedBy: CloudFormation
      CostCenter: Production

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
    Description: Deployment environment (dev or prod)

  TemplateBucket:
    Type: String
    Description: S3 Bucket containing the nested templates
  TemplatePrefix:
    Type: String
    Description: Folder path
  ArtifactBucket:
    Type: String
    Description: The S3 bucket used to store build artifacts
  ECSClusterNameParam:
    Type: String
  Region:
    Type: String
  RootDomainName:
    Type: String
  WWWDomainName:
    Type: String
  Project1Domain:
    Type: String
  Project2Domain:
    Type: String
  ProjectFrontendEcommDomain:
    Type: String
  ProjectBackendEcommDomain:
    Type: String
  HostedZoneId:
    Type: String
  CidrIp:
    Type: String
    Default: |
      Use to secure SSH access to the instances from a specific IP or range.

      # Project 2 Dynamic Pipeline Parameters
  PortfolioRepositoryId:
    Type: String
    Description: GitHub repository for main portfolio (owner/repo)

  PortfolioConnectionArn:
    Type: String
    Description: CodeStar connection ARN for main portfolio

  PortfolioContainerName:
    Type: String
    Description: Container name for main portfolio
    Default: portfolio-container

  PortfolioECRRepository:
    Type: String
    Description: ECR repository name for main portfolio
    Default: portfolio-dev

  # Project 1 Dynamic Pipeline Parameters
  Project1RepositoryId:
    Type: String
    Description: GitHub repository for Project 1 (owner/repo)
    Default: Nelson-Lamounier/magic-rainbow-demo

  Project1ConnectionArn:
    Type: String
    Description: CodeStar connection ARN for Project 1

  Project1ContainerName:
    Type: String
    Description: Container name for Project 1
    Default: project1-container

  Project1ECRRepository:
    Type: String
    Description: ECR repository name for Project 1
    Default: project1-dev

    # Project 2 Dynamic Pipeline Parameters
  Project2RepositoryId:
    Type: String
    Description: GitHub repository for Project 2 (owner/repo)

  Project2ConnectionArn:
    Type: String
    Description: CodeStar connection ARN for Project 2

  Project2ContainerName:
    Type: String
    Description: Container name for Project 2
    Default: project2-container

  Project2ECRRepository:
    Type: String
    Description: ECR repository name for Project 2
    Default:
      project2-dev

      # Project fullStack Dynamic Pipeline Parameters
  ProjectFullStackRepositoryId:
    Type: String
    Description: GitHub repository for Project 2 (owner/repo)

  ProjectFullStackConnectionArn:
    Type: String
    Description: CodeStar connection ARN for Project 2

  ProjectFullStackContainerName:
    Type: String
    Description: Container name for Project 2

  ProjectFullStackSecondaryContainerName:
    Type: String
    Description: Container name for Project 2

  ProjectFullStackECRRepository:
    Type: String
    Description: ECR repository name for Project 2
    Default: frontend-ecomm-dev

  ProjectFullStackSecondaryECRRepository:
    Type: String
    Description: ECR repository name for Project 2
    Default: backend-ecomm-dev

    PortfolioHealthCheckPath:
    Type: String
    Description: Health check path for portfolio service
    Default: "/"
  
  Project1HealthCheckPath:
    Type: String
    Description: Health check path for project1 service
    Default: "/healthcheck"
  
  Project2HealthCheckPath:
    Type: String
    Description: Health check path for project2 service
    Default: "/api/health"
  
  EcommerceFrontendHealthCheckPath:
    Type: String
    Description: Health check path for ecommerce frontend service
    Default: "/health"
  
  EcommerceBackendHealthCheckPath:
    Type: String
    Description: Health check path for ecommerce backend service
    Default: "/api/health"

  MigrationMode:
    Type: String
    Description: Migration mode for Project 1
    AllowedValues:
      - migrate
      - no-migrate
    Default: migrate
    ConstraintDescription: Must be either 'migrate' or 'no-migrate'

  ECSInstanceType:
    Type: String
    Description: EC2 instance type for ECS cluster
    Default: t3.large
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge

  # Add VPC CIDR parameter
  VpcCidr:
    Type: String
    Description: CIDR block for VPC
    Default: "10.0.0.0/16"
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$

Resources:
  VPCStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}core/vpc.yml
      Parameters:
        Environment: !Ref Environment
        VpcCidr: !Ref VpcCidr
        EnableVpcFlowLogs: !If
          - !Equals [!Ref Environment, "production"]
          - "true"
          - "false"
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  LoadBalancerStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - VPCStack
      - SSLCertificateStack
    Properties:
      TemplateURL: !Sub "https://${TemplateBucket}.s3.amazonaws.com/${TemplatePrefix}networking/application-load-balancer.yml"
      Parameters:
        Environment: !Ref Environment
        LoadBalancerName: !Sub "Portfolio-ALB-${Environment}"
        LoadBalancerSGCidrIp: "0.0.0.0/0"
        SSLCertificateArn: !GetAtt CertificateStack.Outputs.CertificateArn
        EnableHTTPS: "true"
        ServicesConfig: !Sub |
          [
            {
              "name": "portfolio",
              "port": 80,
              "domains": ["${RootDomainName}", "${WWWDomainName}"],
              "priority": 100,
              "enabled": true,
              "healthCheckPath": "${PortfolioHealthCheckPath}"
            },
            {
              "name": "project1",
              "port": 3000,
              "domains": ["${Project1Domain}"],
              "priority": 200,
              "enabled": true,
              "healthCheckPath": "${Project1HealthCheckPath}"
            },
            {
              "name": "project2",
              "port": 3001,
              "domains": ["${Project2Domain}"],
              "priority": 300,
              "enabled": true,
              "healthCheckPath": "${Project2HealthCheckPath}"
            },
            {
              "name": "ecommerce-frontend",
              "port": 3002,
              "domains": ["${ProjectFrontendEcommDomain}"],
              "priority": 400,
              "enabled": true,
              "healthCheckPath": "${EcommerceFrontendHealthCheckPath}"
            },
            {
              "name": "ecommerce-backend",
              "port": 4000,
              "domains": ["${ProjectBackendEcommDomain}"],
              "priority": 500,
              "enabled": true,
              "healthCheckPath": "${EcommerceBackendHealthCheckPath}"
            }
          ]
        HealthCheckPath: "/"
        HealthCheckIntervalSeconds: 30
        HealthyThresholdCount: 2
        UnhealthyThresholdCount: 3
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  LaunchTemplateStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: 
      - VPCStack
      - LoadBalancerStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}compute/launch-template.yml
      Parameters:
        ECSClusterNameParam: !Ref ECSClusterNameParam
        PublicSubnetId: !GetAtt VPCStack.Outputs.PublicSubnet1
        CidrIp: !Ref CidrIp
        ECSInstanceType: !Ref ECSInstanceType 
        KeyPairName: "freelancer-key-pair"
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment


  ECSClusterStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VPCStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}compute/ecs-cluster.yml
      Parameters:
        ECSClusterNameParam: !Ref ECSClusterNameParam
        Environment: !Ref Environment
        Region: !Ref Region
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  # ECS Roles Stack (rename from ECSRolesStack for clarity)
  ECSPoliciesStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: 
      - KMSStack
      - VPCStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}security/ecs-policies.yml
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        KMSKeyArn: !GetAtt KMSStack.Outputs.KMSKeyArn
        VPCId: !GetAtt VPCStack.Outputs.VPCId
        LogGroupPrefix: !Sub "/ecs/${ProjectName}"
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Environment
          Value: !Ref Environment

    # Update ECS Security Groups Stack
  ECSSecurityGroupsStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - VPCStack
      - LoadBalancerStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}security/ecs-security-groups.yml
      Parameters:
        Environment: !Ref Environment
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  ServiceStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ECSClusterStack
      - ECSPoliciesStack
      - ECSSecurityGroupsStack
      - LoadBalancerStack
      - AutoScalingStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}compute/ecs-service.yml
      Parameters:
        Environment: !Ref Environment
        ProjectName: Portfolio
        ServiceName: portfolio-service
        ContainerName: !Ref PortfolioContainerName
        ECRRepository: !Ref PortfolioECRRepository
        ContainerPort: 80
        HostPort: 0
        CPU: 256
        Memory: 512
        DesiredCount: !If
          - !Equals [!Ref Environment, "production"]
          - 2
          - 1
        TargetGroupArn: !GetAtt LoadBalancerStack.Outputs.TargetGroupArn
        Region: !Ref Region
        MigrationMode: !Ref MigrationMode
        ExportSuffix: V1
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  Project1ServiceStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ECSClusterStack
      - LoadBalancerStack
      - AutoScalingStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}compute/ecs-service.yml
      Parameters:
        ProjectName: Project1
        ServiceName: project1-service
        ContainerName: project1-container
        ECRRepository: !Ref Project1ECRRepository
        ContainerPort: 3000
        HostPort: 0
        CPU: 128
        Memory: 256
        DesiredCount: 1
        TargetGroupArn: !GetAtt LoadBalancerStack.Outputs.Project1TargetGroupArn
        Region: !Ref Region
        MigrationMode: !Ref MigrationMode
        ExportSuffix: V1
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  Project2ServiceStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ECSClusterStack
      - LoadBalancerStack
      - AutoScalingStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}compute/ecs-service.yml
      Parameters:
        ProjectName: Project2
        ServiceName: project2-service
        ContainerName: project2-container
        ECRRepository: !Ref Project2ECRRepository
        ContainerPort: 3001
        HostPort: 0
        CPU: 128
        Memory: 256
        DesiredCount: 1
        TargetGroupArn: !GetAtt LoadBalancerStack.Outputs.Project2TargetGroupArn
        Region: !Ref Region
        MigrationMode: !Ref MigrationMode
        ExportSuffix: V1
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  ProjectFullStackServiceStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ECSClusterStack
      - LoadBalancerStack
      - AutoScalingStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}compute/ecs-service.yml
      Parameters:
        ProjectName: ProjectFullStack
        ServiceName: fullstack-ecomm-service
        # Primary container (Frontend)
        ContainerName: project-frontend-ecomm-container
        ECRRepository: frontend-ecomm-dev
        ContainerPort: 3002
        HostPort: 0
        CPU: 128
        Memory: 256
        DesiredCount: 1
        TargetGroupArn: !GetAtt LoadBalancerStack.Outputs.ProjectFrontendEcommTargetGroupArn
        # Secondary container (Backend)
        SecondaryContainerName: project-backend-ecomm-container
        SecondaryECRRepository: backend-ecomm-dev
        SecondaryContainerPort: 4000
        SecondaryHostPort: 0
        CPU: 128
        Memory: 256
        DesiredCount: 1
        SecondaryTargetGroupArn: !GetAtt LoadBalancerStack.Outputs.ProjectBackendEcommTargetGroupArn
        # Resources
        Region: !Ref Region
        MigrationMode: !Ref MigrationMode
        ExportSuffix: V1
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  AutoScalingStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - LaunchTemplateStack
      - ECSClusterStack
      - VPCStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}compute/auto-scalling-group.yml
      Parameters:
        Environment: !Ref Environment
        MinSize: !If
          - !Equals [!Ref Environment, "production"]
          - 2
          - 1
        MaxSize: !If
          - !Equals [!Ref Environment, "production"]
          - 6
          - 3
        DesiredCapacity: !If
          - !Equals [!Ref Environment, "production"]
          - 2
          - 1
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  DNSStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: LoadBalancerStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}networking/dns-records.yml
      Parameters:
        Environment: !Ref Environment
        HostedZoneId: !Ref HostedZoneId
        # Environment-specific domain prefix
        EnvironmentDomainPrefix: !If
          - !Equals [!Ref Environment, "production"]
          - ""  # No prefix for production
          - !Sub "${Environment}."  # dev., staging. prefix
        DefaultTTL: !If
          - !Equals [!Ref Environment, "production"]
          - 300   # 5 minutes for production
          - 60    # 1 minute for dev/staging (faster updates)
        DomainsConfig: !Sub |
          [
            {
              "name": "root",
              "domain": "${RootDomainName}",
              "enabled": true,
              "description": "Main portfolio site"
            },
            {
              "name": "www",
              "domain": "${WWWDomainName}",
              "enabled": true,
              "description": "WWW subdomain"
            },
            {
              "name": "project1",
              "domain": "${Project1Domain}",
              "enabled": true,
              "description": "Project 1 application"
            },
            {
              "name": "project2", 
              "domain": "${Project2Domain}",
              "enabled": true,
              "description": "Project 2 application"
            },
            {
              "name": "ecomm-frontend",
              "domain": "${ProjectFrontendEcommDomain}",
              "enabled": true,
              "description": "E-commerce frontend"
            },
            {
              "name": "ecomm-backend",
              "domain": "${ProjectBackendEcommDomain}",
              "enabled": true,
              "description": "E-commerce backend API"
            }
          ]
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment

  SSLCertificateStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}networking/ssl-certificate.yml
      Parameters:
        Environment: !Ref Environment
        HostedZoneId: !Ref HostedZoneId
        PrimaryDomainName: !Ref RootDomainName
        # Environment-specific domain prefix
        EnvironmentDomainPrefix: !If
          - !Equals [!Ref Environment, "production"]
          - ""  # No prefix for production
          - !Sub "${Environment}."  # dev., staging. prefix
        DomainsConfig: !Sub |
          [
            {
              "name": "www",
              "domain": "${WWWDomainName}",
              "enabled": true
            },
            {
              "name": "project1",
              "domain": "${Project1Domain}",
              "enabled": true
            },
            {
              "name": "project2",
              "domain": "${Project2Domain}",
              "enabled": true
            },
            {
              "name": "ecomm-frontend",
              "domain": "${ProjectFrontendEcommDomain}",
              "enabled": true
            },
            {
              "name": "ecomm-backend",
              "domain": "${ProjectBackendEcommDomain}",
              "enabled": true
            }
          ]
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Environment
          Value: !Ref Environment


  KMSStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}security/kms.yml
      Parameters:
        Environment: !Ref Environment
      Tags:
        - Key: Environment
          Value: !Ref Environment
  # CodeBuild Policies Stack
  CodeBuildPoliciesStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: KMSStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}security/codebuild-policies.yml
      Parameters:
        Environment: !Ref Environment
        ArtifactBucket: !Ref ArtifactBucket
        KMSKeyArn: !GetAtt KMSStack.Outputs.KMSKeyArn
        ProjectsConfig: !Sub |
          [
            {
              "name": "Portfolio",
              "ecrRepositories": ["${PortfolioECRRepository}"],
              "enabled": true
            },
            {
              "name": "Project1",
              "ecrRepositories": ["${Project1ECRRepository}"],
              "enabled": true
            },
            {
              "name": "Project2",
              "ecrRepositories": ["project2"],
              "enabled": true
            },
            {
              "name": "ProjectFullStack",
              "ecrRepositories": ["frontend-ecomm", "backend-ecomm"],
              "enabled": true
            }
          ]
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Environment
          Value: !Ref Environment

  # CodePipeline Policies Stack
  CodePipelinePoliciesStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: KMSStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}security/codepipeline-policies.yml
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        ArtifactBucket: !Ref ArtifactBucket
        ConnectionArn: !Ref GitHubConnectionArn
        TaskExecutionRoleArn: !GetAtt ECSRolesStack.Outputs.TaskExecutionRoleArn
        KMSKeyArn: !GetAtt KMSStack.Outputs.KMSKeyArn
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Environment
          Value: !Ref Environment

  # CI/CD Pipeline Stack
  PipelineStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ECSClusterStack
      - ECSRolesStack
      - LoadBalancerStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}pipelines/ci-cd-pipeline.yml
      Parameters:
        Environment: !Ref Environment
        ArtifactBucket: !Sub "${ArtifactBucket}"
        TemplateBucket: !Ref TemplateBucket
        ConnectionArn: !Ref GitHubConnectionArn
        # Environment-specific build configuration
        CodeBuildComputeType: !If
          - !Equals [!Ref Environment, "production"]
          - BUILD_GENERAL1_LARGE
          - BUILD_GENERAL1_MEDIUM
        EnableApprovals: !If
          - !Equals [!Ref Environment, "production"]
          - "true"
          - "false"
        ApprovalTimeoutInMinutes: !If
          - !Equals [!Ref Environment, "production"]
          - 120  # 2 hours for production
          - 60   # 1 hour for staging
        ProjectsConfig: !Sub |
          [
            {
              "name": "Portfolio",
              "repositoryId": "${PortfolioRepositoryId}",
              "containerName": "${PortfolioContainerName}",
              "serviceName": "portfolio-service",
              "ecrRepository": "${PortfolioECRRepository}",
              "projectType": "single-container",
              "enabled": true,
              "branches": {
                "dev": "develop",
                "staging": "staging",
                "production": "main"
              }
            },
            {
              "name": "Project1",
              "repositoryId": "${Project1RepositoryId}",
              "containerName": "${Project1ContainerName}",
              "serviceName": "project1-service",
              "ecrRepository": "${Project1ECRRepository}",
              "projectType": "single-container",
              "enabled": true,
              "branches": {
                "dev": "develop",
                "staging": "staging",
                "production": "main"
              }
            },
            {
              "name": "Project2",
              "repositoryId": "${Project2RepositoryId}",
              "containerName": "project2-container",
              "serviceName": "project2-service",
              "ecrRepository": "project2",
              "projectType": "single-container",
              "enabled": true,
              "branches": {
                "dev": "develop",
                "staging": "staging",
                "production": "main"
              }
            },
            {
              "name": "ProjectFullStack",
              "repositoryId": "${ProjectFullStackRepositoryId}",
              "containerName": "project-frontend-ecomm-container",
              "serviceName": "fullstack-ecomm-service",
              "ecrRepository": "frontend-ecomm",
              "secondaryContainerName": "project-backend-ecomm-container",
              "secondaryServiceName": "backend-ecomm-service",
              "secondaryEcrRepository": "backend-ecomm",
              "projectType": "full-stack",
              "enabled": true,
              "branches": {
                "dev": "develop",
                "staging": "staging",
                "production": "main"
              }
            }
          ]
      Tags:
