# @format
---
AWSTemplateFormatVersion: "2010-09-09"
Description: "Master orchestration template for Portfolio infrastructure using modular stack approach"

Mappings:
  TagMap:
    dev:
      Project: Portfolio
      Owner: Nelson
      CreatedBy: CloudFormation
      CostCenter: DevTeam
    prod:
      Project: Portfolio
      Owner: Nelson
      CreatedBy: CloudFormation
      CostCenter: Production

Parameters:
  # Core Parameters
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
    Description: Deployment environment (dev or prod)

  ProjectName:
    Type: String
    Description: Project name for resource naming
    Default: "Portfolio"

  # Template Configuration
  TemplateBucket:
    Type: String
    Description: S3 Bucket containing the nested templates

  TemplatePrefix:
    Type: String
    Description: Folder path for templates

  ArtifactBucket:
    Type: String
    Description: The S3 bucket used to store build artifacts

  Region:
    Type: String
    Description: AWS Region
    Default: !Ref AWS::Region

  # Networking Parameters
  VpcCidr:
    Type: String
    Description: CIDR block for VPC
    Default: "10.0.0.0/16"

  RootDomainName:
    Type: String
    Description: Root domain name

  WWWDomainName:
    Type: String
    Description: WWW domain name

  Project1Domain:
    Type: String
    Description: Project 1 domain name

  Project2Domain:
    Type: String
    Description: Project 2 domain name

  ProjectFrontendEcommDomain:
    Type: String
    Description: E-commerce frontend domain

  ProjectBackendEcommDomain:
    Type: String
    Description: E-commerce backend domain

  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID

  # Health Check Parameters
  PortfolioHealthCheckPath:
    Type: String
    Default: "/"

  Project1HealthCheckPath:
    Type: String
    Default: "/healthcheck"

  Project2HealthCheckPath:
    Type: String
    Default: "/api/health"

  EcommerceFrontendHealthCheckPath:
    Type: String
    Default: "/health"

  EcommerceBackendHealthCheckPath:
    Type: String
    Default: "/api/health"

  # Compute Parameters
  ECSClusterNameParam:
    Type: String
    Description: ECS Cluster name

  ECSInstanceType:
    Type: String
    Description: EC2 instance type for ECS cluster
    Default: t3.large

  CidrIp:
    Type: String
    Description: CIDR IP for SSH access

  MigrationMode:
    Type: String
    AllowedValues: [migrate, no-migrate]
    Default: migrate

  # GitHub Repository Parameters
  PortfolioRepositoryId:
    Type: String
    Description: GitHub repository for main portfolio

  PortfolioConnectionArn:
    Type: String
    Description: CodeStar connection ARN for main portfolio

  Project1RepositoryId:
    Type: String
    Description: GitHub repository for Project 1

  Project1ConnectionArn:
    Type: String
    Description: CodeStar connection ARN for Project 1

  Project2RepositoryId:
    Type: String
    Description: GitHub repository for Project 2

  Project2ConnectionArn:
    Type: String
    Description: CodeStar connection ARN for Project 2

  ProjectFullStackRepositoryId:
    Type: String
    Description: GitHub repository for Full Stack project

  ProjectFullStackConnectionArn:
    Type: String
    Description: CodeStar connection ARN for Full Stack project

  # Container and ECR Parameters
  PortfolioContainerName:
    Type: String
    Default: "portfolio-container"

  PortfolioECRRepository:
    Type: String
    Default: "portfolio-dev"

  Project1ContainerName:
    Type: String
    Default: "project1-container"

  Project1ECRRepository:
    Type: String
    Default: "project1-dev"

  Project2ContainerName:
    Type: String
    Default: "project2-container"

  Project2ECRRepository:
    Type: String
    Default: "project2-dev"

  ProjectFullStackContainerName:
    Type: String
    Default: "project-frontend-ecomm-container"

  ProjectFullStackSecondaryContainerName:
    Type: String
    Default: "project-backend-ecomm-container"

  ProjectFullStackECRRepository:
    Type: String
    Default: "frontend-ecomm-dev"

  ProjectFullStackSecondaryECRRepository:
    Type: String
    Default: "backend-ecomm-dev"

Resources:
  # Networking Stack - VPC, Load Balancer, DNS, SSL
  NetworkingStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}stacks/networking-stack.yml"
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        TemplateBucket: !Ref TemplateBucket
        TemplatePrefix: !Ref TemplatePrefix
        VpcCidr: !Ref VpcCidr
        RootDomainName: !Ref RootDomainName
        WWWDomainName: !Ref WWWDomainName
        Project1Domain: !Ref Project1Domain
        Project2Domain: !Ref Project2Domain
        ProjectFrontendEcommDomain: !Ref ProjectFrontendEcommDomain
        ProjectBackendEcommDomain: !Ref ProjectBackendEcommDomain
        HostedZoneId: !Ref HostedZoneId
        PortfolioHealthCheckPath: !Ref PortfolioHealthCheckPath
        Project1HealthCheckPath: !Ref Project1HealthCheckPath
        Project2HealthCheckPath: !Ref Project2HealthCheckPath
        EcommerceFrontendHealthCheckPath: !Ref EcommerceFrontendHealthCheckPath
        EcommerceBackendHealthCheckPath: !Ref EcommerceBackendHealthCheckPath
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment
        - Key: StackType
          Value: "Networking"

  # Security Stack - KMS, IAM, Security Groups
  SecurityStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: NetworkingStack
    Properties:
      TemplateURL: !Sub "https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}stacks/security-stack.yml"
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        TemplateBucket: !Ref TemplateBucket
        TemplatePrefix: !Ref TemplatePrefix
        ArtifactBucket: !Ref ArtifactBucket
        VPCId: !GetAtt NetworkingStack.Outputs.VPCId
        LoadBalancerSecurityGroupId: !GetAtt NetworkingStack.Outputs.LoadBalancerSecurityGroupId
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment
        - Key: StackType
          Value: "Security"

  # Compute Stack - ECS Cluster, Services, Auto Scaling
  ComputeStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - NetworkingStack
      - SecurityStack
    Properties:
      TemplateURL: !Sub "https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}stacks/compute-stack.yml"
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        TemplateBucket: !Ref TemplateBucket
        TemplatePrefix: !Ref TemplatePrefix
        Region: !Ref Region
        ECSClusterNameParam: !Ref ECSClusterNameParam
        ECSInstanceType: !Ref ECSInstanceType
        CidrIp: !Ref CidrIp
        MigrationMode: !Ref MigrationMode
        PortfolioContainerName: !Ref PortfolioContainerName
        PortfolioECRRepository: !Ref PortfolioECRRepository
        Project1ContainerName: !Ref Project1ContainerName
        Project1ECRRepository: !Ref Project1ECRRepository
        Project2ContainerName: !Ref Project2ContainerName
        Project2ECRRepository: !Ref Project2ECRRepository
        ProjectFullStackContainerName: !Ref ProjectFullStackContainerName
        ProjectFullStackSecondaryContainerName: !Ref ProjectFullStackSecondaryContainerName
        ProjectFullStackECRRepository: !Ref ProjectFullStackECRRepository
        ProjectFullStackSecondaryECRRepository: !Ref ProjectFullStackSecondaryECRRepository
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment
        - Key: StackType
          Value: "Compute"

  # CI/CD Stack - CodePipeline, CodeBuild
  CICDStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - SecurityStack
      - ComputeStack
    Properties:
      TemplateURL: !Sub "https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}stacks/cicd-stack.yml"
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        TemplateBucket: !Ref TemplateBucket
        TemplatePrefix: !Ref TemplatePrefix
        ArtifactBucket: !Ref ArtifactBucket
        PortfolioRepositoryId: !Ref PortfolioRepositoryId
        PortfolioConnectionArn: !Ref PortfolioConnectionArn
        Project1RepositoryId: !Ref Project1RepositoryId
        Project1ConnectionArn: !Ref Project1ConnectionArn
        Project2RepositoryId: !Ref Project2RepositoryId
        Project2ConnectionArn: !Ref Project2ConnectionArn
        ProjectFullStackRepositoryId: !Ref ProjectFullStackRepositoryId
        ProjectFullStackConnectionArn: !Ref ProjectFullStackConnectionArn
        PortfolioContainerName: !Ref PortfolioContainerName
        Project1ContainerName: !Ref Project1ContainerName
        Project2ContainerName: !Ref Project2ContainerName
        ProjectFullStackContainerName: !Ref ProjectFullStackContainerName
        ProjectFullStackSecondaryContainerName: !Ref ProjectFullStackSecondaryContainerName
        PortfolioECRRepository: !Ref PortfolioECRRepository
        Project1ECRRepository: !Ref Project1ECRRepository
        Project2ECRRepository: !Ref Project2ECRRepository
        ProjectFullStackECRRepository: !Ref ProjectFullStackECRRepository
        ProjectFullStackSecondaryECRRepository: !Ref ProjectFullStackSecondaryECRRepository
      Tags:
        - Key: Project
          Value: !FindInMap [TagMap, !Ref Environment, Project]
        - Key: Owner
          Value: !FindInMap [TagMap, !Ref Environment, Owner]
        - Key: CreatedBy
          Value: !FindInMap [TagMap, !Ref Environment, CreatedBy]
        - Key: CostCenter
          Value: !FindInMap [TagMap, !Ref Environment, CostCenter]
        - Key: Environment
          Value: !Ref Environment
        - Key: StackType
          Value: "CICD"

Outputs:
  # High-level stack outputs
  NetworkingStackId:
    Description: Networking Stack ID
    Value: !Ref NetworkingStack
    Export:
      Name: !Sub "${ProjectName}-NetworkingStackId-${Environment}"

  SecurityStackId:
    Description: Security Stack ID
    Value: !Ref SecurityStack
    Export:
      Name: !Sub "${ProjectName}-SecurityStackId-${Environment}"

  ComputeStackId:
    Description: Compute Stack ID
    Value: !Ref ComputeStack
    Export:
      Name: !Sub "${ProjectName}-ComputeStackId-${Environment}"

  CICDStackId:
    Description: CI/CD Stack ID
    Value: !Ref CICDStack
    Export:
      Name: !Sub "${ProjectName}-CICDStackId-${Environment}"

  # Key infrastructure outputs for external reference
  VPCId:
    Description: VPC ID
    Value: !GetAtt NetworkingStack.Outputs.VPCId
    Export:
      Name: !Sub "${ProjectName}-VPCId-${Environment}"

  LoadBalancerDNSName:
    Description: Load Balancer DNS Name
    Value: !GetAtt NetworkingStack.Outputs.LoadBalancerDNSName
    Export:
      Name: !Sub "${ProjectName}-LoadBalancerDNSName-${Environment}"

  ECSClusterName:
    Description: ECS Cluster Name
    Value: !GetAtt ComputeStack.Outputs.ECSClusterName
    Export:
      Name: !Sub "${ProjectName}-ECSClusterName-${Environment}"

  # Environment configuration summary
  DeploymentSummary:
    Description: Deployment configuration summary
    Value: !Sub |
      Environment: ${Environment}
      Project: ${ProjectName}
      Region: ${Region}
      VPC CIDR: ${VpcCidr}
      ECS Instance Type: ${ECSInstanceType}
      Deployment Date: ${AWS::StackName}


