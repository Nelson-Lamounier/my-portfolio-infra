# @format
---
AWSTemplateFormatVersion: "2010-09-09"
Description: Environment-aware Auto Scaling Group for ECS instances with enhanced monitoring and cost optimization

Parameters:
  Environment:
    Description: Environment name for resource naming and isolation
    Type: String
    AllowedValues: ["dev", "staging", "production"]
    Default: dev

  ProjectName:
    Description: Project name for resource naming
    Type: String
    Default: "Portfolio"

  MinSize:
    Description: Minimum number of instances
    Type: Number
    Default: 1

  MaxSize:
    Description: Maximum number of instances
    Type: Number
    Default: 3

  DesiredCapacity:
    Description: Desired number of instances
    Type: Number
    Default: 1

  # Target CPU utilization for target tracking scaling
  TargetCPUUtilization:
    Description: Target CPU utilization percentage for auto scaling
    Type: Number
    Default: 70
    MinValue: 50
    MaxValue: 90

Mappings:
  # Environment-specific configurations
  EnvironmentMap:
    dev:
      InstanceProtection: false
      WarmPoolEnabled: false
      MaxBatchSize: 1
      ScaleUpCooldown: 300
      ScaleDownCooldown: 600
    staging:
      InstanceProtection: false
      WarmPoolEnabled: true
      MaxBatchSize: 1
      ScaleUpCooldown: 300
      ScaleDownCooldown: 600
    production:
      InstanceProtection: true
      WarmPoolEnabled: true
      MaxBatchSize: 1
      ScaleUpCooldown: 180
      ScaleDownCooldown: 900

Conditions:
  IsProduction: !Equals [!Ref Environment, "production"]
  EnableWarmPool: !FindInMap [EnvironmentMap, !Ref Environment, WarmPoolEnabled]

Resources:
  # Auto Scaling Group with enhanced configuration
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: !If [IsProduction, 1, 0]
        MaxBatchSize: !FindInMap [EnvironmentMap, !Ref Environment, MaxBatchSize]
        PauseTime: PT10M
        WaitOnResourceSignals: true
        SuspendProcesses:
          - HealthCheck
          - ReplaceUnhealthy
          - AZRebalance
          - AlarmNotification
          - ScheduledActions
    Properties:
      AutoScalingGroupName: !Sub "${ProjectName}-ECS-ASG-${Environment}"
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      VPCZoneIdentifier:
        - !ImportValue 
          Fn::Sub: "${ProjectName}-PrivateSubnet1-${Environment}"
        - !ImportValue 
          Fn::Sub: "${ProjectName}-PrivateSubnet2-${Environment}"
      LaunchTemplate:
        LaunchTemplateId: !ImportValue 
          Fn::Sub: "${ProjectName}-LaunchTemplateId-${Environment}"
        Version: !ImportValue 
          Fn::Sub: "${ProjectName}-LaunchTemplateVersion-${Environment}"
      HealthCheckType: EC2
      HealthCheckGracePeriod: 300
      DefaultCooldown: 300
      CapacityRebalance: !FindInMap [EnvironmentMap, !Ref Environment, InstanceProtection]
      NewInstancesProtectedFromScaleIn: !FindInMap [EnvironmentMap, !Ref Environment, InstanceProtection]
      TerminationPolicies:
        - OldestInstance
        - Default
      EnabledMetrics:
        - GroupMinSize
        - GroupMaxSize
        - GroupDesiredCapacity
        - GroupInServiceInstances
        - GroupTotalInstances
        - GroupPendingInstances
        - GroupStandbyInstances
        - GroupTerminatingInstances
      NotificationConfigurations:
        - TopicARN: !Ref ScalingNotificationTopic
          NotificationTypes:
            - autoscaling:EC2_INSTANCE_LAUNCH
            - autoscaling:EC2_INSTANCE_TERMINATE
            - autoscaling:EC2_INSTANCE_LAUNCH_ERROR
            - autoscaling:EC2_INSTANCE_TERMINATE_ERROR
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-ECSInstance-${Environment}"
          PropagateAtLaunch: true
        - Key: AmazonECSManaged
          Value: "true"
          PropagateAtLaunch: true
        - Key: Environment
          Value: !Ref Environment
          PropagateAtLaunch: true
        - Key: Project
          Value: !Ref ProjectName
          PropagateAtLaunch: true
        - Key: Component
          Value: "ECS-AutoScaling"
          PropagateAtLaunch: true

  # Target Tracking Scaling Policy (Better than Simple Scaling)
  TargetTrackingScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: !Ref TargetCPUUtilization
        ScaleOutCooldown: !FindInMap [EnvironmentMap, !Ref Environment, ScaleUpCooldown]
        ScaleInCooldown: !FindInMap [EnvironmentMap, !Ref Environment, ScaleDownCooldown]
        DisableScaleIn: false

  # SNS Topic for Scaling Notifications
  ScalingNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-ASG-Notifications-${Environment}"
      DisplayName: !Sub "Auto Scaling Group notifications for ${Environment}"

  # Optional Warm Pool for Cost Optimization
  WarmPool:
    Type: AWS::AutoScaling::WarmPool
    Condition: EnableWarmPool
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      MinSize: 0
      MaxGroupPreparedCapacity: 2
      PoolState: Stopped  # Cost-effective for non-production
      InstanceReusePolicy:
        ReuseOnScaleIn: true

Outputs:
  AutoScalingGroupName:
    Description: Name of the Auto Scaling Group
    Value: !Ref AutoScalingGroup
    Export:
      Name: !Sub "${ProjectName}-AutoScalingGroupName-${Environment}"

  AutoScalingGroupArn:
    Description: ARN of the Auto Scaling Group
    Value: !Ref AutoScalingGroup
    Export:
      Name: !Sub "${ProjectName}-AutoScalingGroupArn-${Environment}"

  TargetTrackingPolicyArn:
    Description: ARN of the target tracking scaling policy
    Value: !Ref TargetTrackingScalingPolicy
    Export:
      Name: !Sub "${ProjectName}-TargetTrackingPolicyArn-${Environment}"

  ScalingNotificationTopicArn:
    Description: ARN of the scaling notification topic
    Value: !Ref ScalingNotificationTopic
    Export:
      Name: !Sub "${ProjectName}-ScalingNotificationTopicArn-${Environment}"