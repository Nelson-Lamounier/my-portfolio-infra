# @format
AWSTemplateFormatVersion: "2010-09-09"

Description: |
  Ultra-Dynamic CI/CD Pipeline Template for Multi-Environment Container Applications

  This template creates environment-specific CI/CD pipelines with dynamic project
  configuration, automated testing, and deployment approval workflows.

Parameters:
  # Environment Parameter
  Environment:
    Type: String
    Description: Environment name for resource naming and deployment targeting
    Default: "dev"
    AllowedValues: ["dev", "staging", "production"]

  # Project Configuration
  ProjectName:
    Type: String
    Description: Project name for resource naming
    Default: "Portfolio"

  # Project Configuration as JSON Array
  ProjectsConfig:
    Description: |
      JSON array of project configurations for CI/CD pipelines
    Type: String
    Default: |
      [
        {
          "name": "Portfolio",
          "repositoryId": "Nelson-Lamounier/portfolio-frontend",
          "containerName": "portfolio-container",
          "serviceName": "portfolio-service",
          "ecrRepository": "portfolio",
          "projectType": "single-container",
          "enabled": true,
          "healthCheckPath": "/",
          "branches": {
            "dev": "develop",
            "staging": "staging",
            "production": "main"
          }
        },
        {
          "name": "Project1",
          "repositoryId": "Nelson-Lamounier/magic-rainbow-demo",
          "containerName": "project1-container",
          "serviceName": "project1-service",
          "ecrRepository": "project1",
          "projectType": "single-container",
          "enabled": true,
          "healthCheckPath": "/healthcheck",
          "branches": {
            "dev": "develop",
            "staging": "staging",
            "production": "main"
          }
        }
      ]

  # Infrastructure Configuration
  ArtifactBucket:
    Description: S3 bucket name for storing pipeline artifacts
    Type: String

  TemplateBucket:
    Description: S3 bucket containing CloudFormation templates
    Type: String

  ConnectionArn:
    Description: ARN of the CodeStar connection for GitHub integration
    Type: String

  # Build Configuration
  CodeBuildImage:
    Description: Docker image for CodeBuild environment
    Type: String
    Default: "aws/codebuild/standard:7.0"

  # Approval Configuration
  EnableApprovals:
    Description: Enable manual approval for deployments
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"

  ApprovalTimeoutInMinutes:
    Description: Timeout for manual approvals (in minutes)
    Type: Number
    Default: 60
    MinValue: 5
    MaxValue: 1440

  # Enhanced build configuration with security
  CodeBuildComputeType:
    Description: Compute type for CodeBuild projects
    Type: String
    Default: "BUILD_GENERAL1_SMALL"
    AllowedValues: ["BUILD_GENERAL1_SMALL", "BUILD_GENERAL1_MEDIUM", "BUILD_GENERAL1_LARGE"]

Mappings:
  # Environment-specific build configurations
  BuildConfigMap:
    dev:
      ComputeType: BUILD_GENERAL1_SMALL
      TimeoutMinutes: 30
      QueuedTimeoutMinutes: 15
      ConcurrentBuilds: 3
      AutoTrigger: true
      TestingEnabled: false
    staging:
      ComputeType: BUILD_GENERAL1_MEDIUM
      TimeoutMinutes: 45
      QueuedTimeoutMinutes: 20
      ConcurrentBuilds: 2
      AutoTrigger: false
      TestingEnabled: true
    production:
      ComputeType: BUILD_GENERAL1_LARGE
      TimeoutMinutes: 60
      QueuedTimeoutMinutes: 30
      ConcurrentBuilds: 1
      AutoTrigger: false
      TestingEnabled: true

  # Environment-specific pipeline configurations
  PipelineConfigMap:
    dev:
      ApprovalRequired: false
      DeploymentStrategy: "rolling"
      MonitoringLevel: "basic"
      RollbackEnabled: false
    staging:
      ApprovalRequired: true
      DeploymentStrategy: "blue-green"
      MonitoringLevel: "enhanced"
      RollbackEnabled: true
    production:
      ApprovalRequired: true
      DeploymentStrategy: "blue-green"
      MonitoringLevel: "full"
      RollbackEnabled: true

Conditions:
  # Environment-specific conditions
  IsProduction: !Equals [!Ref Environment, "production"]
  IsStaging: !Equals [!Ref Environment, "staging"]
  IsDevelopment: !Equals [!Ref Environment, "dev"]
  
  # Feature conditions
  RequiresApproval: !Or
    - !And
      - !Equals [!Ref EnableApprovals, "true"]
      - !Or [!Condition IsProduction, !Condition IsStaging]
    - !FindInMap [PipelineConfigMap, !Ref Environment, ApprovalRequired]
  
  EnableTesting: !FindInMap [BuildConfigMap, !Ref Environment, TestingEnabled]
  AutoTriggerEnabled: !FindInMap [BuildConfigMap, !Ref Environment, AutoTrigger]

Transform: AWS::LanguageExtensions

Resources:
  # Enhanced CodeBuild Projects with better security
  Fn::ForEach::CodeBuildProjects:
    - ProjectItem
    - !Ref ProjectsConfig
    - "${ProjectItem.name}CodeBuildProject":
        Type: AWS::CodeBuild::Project
        Properties:
          Name: !Sub "${ProjectName}-${ProjectItem.name}-${Environment}-CodeBuild"
          Description: !Sub "CodeBuild project for ${ProjectItem.name} in ${Environment}"
          Source:
            Type: CODEPIPELINE
            BuildSpec: !If
              - IsProduction
              - !Sub "buildspec-${Environment}.yml"
              - "buildspec.yml"
          Artifacts:
            Type: CODEPIPELINE
          Environment:
            # Environment-specific compute sizing
            ComputeType: !FindInMap [BuildConfigMap, !Ref Environment, ComputeType]
            Image: !Ref CodeBuildImage
            Type: LINUX_CONTAINER
            PrivilegedMode: true  # Only for Docker builds
            EnvironmentVariables:
              - Name: AWS_REGION
                Value: !Ref AWS::Region
              - Name: AWS_ACCOUNT_ID
                Value: !Ref AWS::AccountId
              - Name: ENVIRONMENT
                Value: !Ref Environment
              - Name: PROJECT_NAME
                Value: !Ref ProjectName
              - Name: ECR_REPOSITORY_NAME
                Value: !Sub "${ProjectItem.ecrRepository}-${Environment}"
              - Name: CONTAINER_NAME
                Value: !Ref "${ProjectItem.containerName}"
              - Name: PROJECT_TYPE
                Value: !Ref "${ProjectItem.projectType}"
              - Name: HEALTH_CHECK_PATH
                Value: !Ref "${ProjectItem.healthCheckPath}"
          ServiceRole: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-CodeBuildRole-${Environment}"
          TimeoutInMinutes: !FindInMap [BuildConfigMap, !Ref Environment, TimeoutMinutes]
          QueuedTimeoutInMinutes: !FindInMap [BuildConfigMap, !Ref Environment, QueuedTimeoutMinutes]
          ConcurrentBuildLimit: !FindInMap [BuildConfigMap, !Ref Environment, ConcurrentBuilds]
          Tags:
            - Key: Name
              Value: !Sub "${ProjectName}-${ProjectItem.name}-${Environment}-CodeBuild"
            - Key: Environment
              Value: !Ref Environment
            - Key: Project
              Value: !Ref "${ProjectItem.name}"

  # Dynamic CodePipelines
  Fn::ForEach::CodePipelines:
    - ProjectItem
    - !Ref ProjectsConfig
    - "${ProjectItem.name}Pipeline":
        Type: AWS::CodePipeline::Pipeline
        Properties:
          Name: !Sub "${ProjectName}-${ProjectItem.name}-${Environment}-Pipeline"
          RoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-CodePipelineRole-${Environment}"
          ArtifactStore:
            Type: S3
            Location: !Sub "${ArtifactBucket}-${Environment}"
            EncryptionKey:
              Type: KMS
              Id: !ImportValue
                Fn::Sub: "${ProjectName}-KMSKeyId-${Environment}"
          Stages:
            # Source Stage with secure connection
            - Name: Source
              Actions:
                - Name: SourceAction
                  ActionTypeId:
                    Category: Source
                    Owner: AWS
                    Provider: CodeStarSourceConnection
                    Version: 1
                  Configuration:
                    ConnectionArn: !Ref ConnectionArn
                    FullRepositoryId: !Ref "${ProjectItem.repositoryId}"
                    BranchName: !Sub "${ProjectItem.branches.${Environment}}"
                    OutputArtifactFormat: CODE_ZIP
                    DetectChanges: !FindInMap [BuildConfigMap, !Ref Environment, AutoTrigger]
                  OutputArtifacts:
                    - Name: SourceOutput

            # Build Stage
            - Name: Build
              Actions:
                - Name: Build
                  ActionTypeId:
                    Category: Build
                    Owner: AWS
                    Provider: CodeBuild
                    Version: 1
                  InputArtifacts:
                    - Name: SourceOutput
                  OutputArtifacts:
                    - Name: BuildOutput
                  Configuration:
                    ProjectName: !Sub "${ProjectName}-${ProjectItem.name}-${Environment}-CodeBuild"

            # Conditional Testing Stage
            - !If
              - EnableTesting
              - Name: Test
                Actions:
                  - Name: UnitTests
                    ActionTypeId:
                      Category: Test
                      Owner: AWS
                      Provider: CodeBuild
                      Version: 1
                    InputArtifacts:
                      - Name: SourceOutput
                    Configuration:
                      ProjectName: !Sub "${ProjectName}-${ProjectItem.name}-${Environment}-Tests"
              - !Ref AWS::NoValue

            # Conditional Approval Stage
            - !If
              - RequiresApproval
              - Name: Approval
                Actions:
                  - Name: ManualApproval
                    ActionTypeId:
                      Category: Approval
                      Owner: AWS
                      Provider: Manual
                      Version: 1
                    Configuration:
                      NotificationArn: !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ProjectName}-ApprovalTopic-${Environment}"
                      CustomData: !Sub |
                        Please review and approve deployment of ${ProjectItem.name} to ${Environment}
                        
                        Project: ${ProjectItem.name}
                        Environment: ${Environment}
                        Repository: ${ProjectItem.repositoryId}
                        
                        Review the build artifacts and approve if ready for deployment.
                      ExternalEntityLink: !Sub "https://console.aws.amazon.com/codesuite/codebuild/projects/${ProjectName}-${ProjectItem.name}-${Environment}-CodeBuild/history"
                    TimeoutInMinutes: !Ref ApprovalTimeoutInMinutes
              - !Ref AWS::NoValue

            # Deploy Stage
            - Name: Deploy
              Actions:
                - Name: DeployECS
                  ActionTypeId:
                    Category: Deploy
                    Owner: AWS
                    Provider: ECS
                    Version: 1
                  InputArtifacts:
                    - Name: BuildOutput
                  Configuration:
                    ClusterName: !Sub "${ProjectName}-ECSCluster-${Environment}"
                    ServiceName: !Sub "${Environment}-${ProjectItem.name}-${ProjectItem.serviceName}"
                    FileName: imagedefinitions.json

          Tags:
            - Key: Name
              Value: !Sub "${ProjectName}-${ProjectItem.name}-${Environment}-Pipeline"
            - Key: Environment
              Value: !Ref Environment
            - Key: Project
              Value: !Ref "${ProjectItem.name}"

Outputs:
  # Environment Pipeline Summary
  EnvironmentPipelineInfo:
    Description: Environment-specific pipeline configuration summary
    Value: !Sub |
      Environment: ${Environment}
      Project: ${ProjectName}
      Compute Type: ${BuildConfigMap.${Environment}.ComputeType}
      Testing Enabled: ${BuildConfigMap.${Environment}.TestingEnabled}
      Approvals Required: ${PipelineConfigMap.${Environment}.ApprovalRequired}
      Auto Trigger: ${BuildConfigMap.${Environment}.AutoTrigger}
      Artifact Bucket: ${ArtifactBucket}-${Environment}
    Export:
      Name: !Sub "${ProjectName}-PipelineEnvironmentInfo-${Environment}"

  # Pipeline count for monitoring
  ActivePipelineCount:
    Description: Number of active pipelines in this environment
    Value: !Length !Ref ProjectsConfig
    Export:
      Name: !Sub "${ProjectName}-ActivePipelineCount-${Environment}"