# @format
AWSTemplateFormatVersion: "2010-09-09"

Description: |
  Dynamic CI/CD Pipeline Template for Container Applications

  This reusable template creates a complete CI/CD pipeline that can be configured
  for different projects without code duplication. It orchestrates the entire
  deployment workflow from source code to running containers in ECS.

  Pipeline Flow:
  1. Source: Pulls code from GitHub using secure CodeStar connections
  2. Build: Compiles code, builds Docker images, pushes to ECR
  3. Deploy: Updates ECS service with new container image

  Key Features:
  - Modular IAM policies through nested stacks
  - Flexible BuildSpec configuration (default or custom)
  - Project-specific resource naming to prevent conflicts
  - Secure credential management through SSM and CodeStar connections

Parameters:
  ArtifactBucket:
    Description: |
      S3 bucket name for storing pipeline artifacts.
      This bucket serves as temporary storage for source code, build outputs,
      and deployment artifacts as they move between pipeline stages.
      Should be pre-created and accessible by the pipeline role.
    Type: String
    Default: infra/

    # Optional secondary service for full-stack applications
  SecondaryServiceName:
    Description: Name of the secondary ECS service (for full-stack apps)
    Type: String
    Default: ""

  ServiceName:
    Description: |
      Name of the target ECS service for deployments.
      This service must exist in the ECS cluster and should match the
      container name specified in the task definition.
      Example: 'portfolio-service', 'api-service'
    Type: String

  ProjectName:
    Description: |
      Unique identifier for this project's resources.
      Used to create unique names for CodeBuild projects, pipelines,
      and IAM roles to prevent conflicts when deploying multiple pipelines.
      Convention: PascalCase (e.g., 'Portfolio', 'EcommerceAPI', 'BlogApp')
    Type: String

  RepositoryId:
    Description: |
      GitHub repository identifier in 'owner/repository' format.
      This repository contains the source code and Dockerfile for the application.
      Examples: 'myorg/frontend-app', 'username/personal-portfolio'
      Repository must be accessible via the provided CodeStar connection.
    Type: String

  ConnectionArn:
    Description: |
      ARN of the CodeStar connection for GitHub integration.
      This connection must be pre-established and approved in both AWS and GitHub.
      Provides secure, token-based authentication without storing credentials.
      Format: arn:aws:codeconnections:region:account:connection/connection-id
    Type: String

  ContainerName:
    Description: |
      Container name as defined in the ECS task definition.
      This name is used in imagedefinitions.json to specify which container
      image to update during deployment. Must match exactly with the task definition.
      If unsure, check your ECS task definition in the AWS Console.
    Type: String

  # Optional secondary container for full-stack applications
  SecondaryContainerName:
    Description: Secondary container name (for full-stack apps)
    Type: String
    Default: ""

  ECRRepositoryName:
    Description: |
      Name of the ECR repository for storing Docker images.
      Repository must exist before pipeline execution and should follow
      naming conventions (lowercase, hyphen-separated).
      Examples: 'portfolio-app', 'ecommerce-frontend', 'api-backend'

    # Optional secondary ECR repository for full-stack applications
    Type: String

  SecondaryECRRepositoryName:
    Description: Name of the secondary ECR repository (for full-stack apps)
    Type: String
    Default: ""

  TemplateBucket:
    Description: |
      S3 bucket containing CloudFormation templates.
      Used by nested stacks to reference IAM policy templates.
    Type: String

  # Project type to determine build strategy
  ProjectType:
    Description: Type of project (single-container or full-stack)
    Type: String
    AllowedValues:
      - single-container
      - full-stack
    Default: single-container

Conditions:
  IsFullStack: !Equals
    - !Ref ProjectType
    - full-stack

  HasSecondaryService: !Not
    - !Equals
      - !Ref SecondaryServiceName
      - ""

Resources:

  # # Nested Stack: CodeBuild IAM Policies
  # # Separates IAM concerns for better maintainability and reusability

  # CodeBuild Project: Handles Docker image compilation and ECR publishing
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${ProjectName}-CodeBuild
      Source:
        Type: CODEPIPELINE

        # Always use buildspec.yml from the repository
        # Remove BuildSpec property to use default buildspec.yml location
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId

          # Pass ECR repository name to buildspec
          - Name: ECR_REPOSITORY_NAME
            Value: !Ref ECRRepositoryName

          # Pass container name to buildspec
          - Name: CONTAINER_NAME
            Value: !Ref ContainerName

          # Conditional environment variables for full-stack
          - Name: SECONDARY_ECR_REPOSITORY_NAME
            Value: !If
              - HasSecondaryContainer
              - !Ref SecondaryECRRepositoryName
              - ""
          - Name: SECONDARY_CONTAINER_NAME
            Value: !If
              - HasSecondaryContainer
              - !Ref SecondaryContainerName
              - ""
      ServiceRole: !ImportValue Portfolio-CodeBuildRoleArn

  # CodePipeline: Orchestrates the complete CI/CD workflow
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:

      # Project-specific naming for easy identification in console
      Name: !Sub ${ProjectName}-Pipeline

      # Use IAM role from nested stack for pipeline orchestration
      RoleArn: !ImportValue Portfolio-CodePipelineRoleArn

      # Artifact storage configuration
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:

        # Stage 1: Source Code Retrieval
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection # Secure GitHub integration
                Version: 1
              Configuration:
                ConnectionArn: !Ref ConnectionArn # Pre-established GitHub connection
                FullRepositoryId: !Ref RepositoryId # Target repository
                BranchName: main # Primary branch for deployments
                OutputArtifactFormat: CODE_ZIP # Compressed source for efficiency
              OutputArtifacts:

                # Source code package for build stage
                - Name: SourceOutput

        # Stage 2: Build and Image Creation
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild # Managed build service
                Version: 1
              InputArtifacts:

                # Source code from previous stage
                - Name: SourceOutput
              OutputArtifacts:

                # Build artifacts including imagedefinitions.json
                - Name: BuildOutput
              Configuration:

                # Reference to CodeBuild project created above
                ProjectName: !Ref CodeBuildProject

        # Stage 3: ECS Deployment
        - Name: Deploy
          Actions: !If
            - - Name: DeployECS
                ActionTypeId:
                  Category: Deploy
                  Owner: AWS
                  Provider: ECS # Native ECS deployment action
                  Version: 1
                InputArtifacts:

                  # Build artifacts containing deployment manifest
                  - Name: BuildOutput
                Configuration:

                  # Target ECS cluster (imported from infrastructure stack)
                  ClusterName: !ImportValue ECSClusterName

                  # Target ECS service for container updates
                  ServiceName: !Ref ServiceName

                  # Deployment manifest specifying container image updates
                  FileName: imagedefinitions.json

            # Single-container fallback
            - - Name: DeployECS
                ActionTypeId:
                  Category: Deploy
                  Owner: AWS
                  Provider: ECS
                  Version: 1
                InputArtifacts:
                  - Name: BuildOutput
                Configuration:
                  ClusterName: !ImportValue ECSClusterName
                  ServiceName: !Ref ServiceName
                  FileName: imagedefinitions.json

Outputs:
  PipelineName:
    Description: |
      Name of the created CodePipeline.

      Use this output to reference the pipeline in monitoring, notifications,
      or other automation workflows. The pipeline name follows the pattern
      '{ProjectName}-Pipeline' for consistent identification.
    Value: !Ref Pipeline
    Export:

      # Export for potential use by monitoring or notification stacks
      Name: !Sub ${ProjectName}-PipelineName
